apiVersion: 1

prune: true

datasources:
  - name: DTMO Intelligence
    uid: dtmo-postgres-readonly
    orgId: 1
    type: postgres
    access: proxy
    url: postgres:5432
    user: dtmo_grafana_reader
    isDefault: false
    editable: false
    secureJsonData:
      password: $__env{GRAFANA_DB_PASSWORD}
    jsonData:
      database: dtmo
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      maxIdleConnsAuto: false
      connMaxLifetime: 300
      postgresVersion: 1700
      timescaledb: false
