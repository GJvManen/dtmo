name: E5 E7 Framework Governance Gate

on:
  pull_request:
    branches: [main, enhancement/e4-analytics-trends]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Validate framework governance and preserved product contracts
        run: |
          pytest -q \
            backend/tests/test_e5_e7_framework_governance.py \
            backend/tests/test_governance_explicit_control_crosswalk.py \
            backend/tests/test_e4_analytics_trends.py \
            backend/tests/test_e1_e2_severity_experience.py \
            backend/tests/test_rc13_4_governance_knowledge.py \
            backend/tests/test_rc13_owner_retest_usability_contract.py \
            backend/tests/test_rc13_5_acceptance_contract.py

      - name: Validate bounded code quality
        run: |
          ruff check \
            backend/dtmo/framework_governance.py \
            backend/dtmo/framework_experience.py \
            backend/dtmo/governance_crosswalk.py \
            backend/dtmo/governance_crosswalk_experience.py \
            backend/dtmo/persistence/framework_models.py \
            backend/tests/test_e5_e7_framework_governance.py \
            backend/tests/test_governance_explicit_control_crosswalk.py \
            database/migrations/versions/0010_framework_governance.py
          mypy \
            backend/dtmo/framework_governance.py \
            backend/dtmo/framework_experience.py \
            backend/dtmo/governance_crosswalk.py \
            backend/dtmo/governance_crosswalk_experience.py \
            backend/dtmo/persistence/framework_models.py

      - name: Record exact-head evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "workflow": "E5 E7 Framework Governance Gate",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "scope": [
                  "versioned framework inventory",
                  "explicit intelligence mappings",
                  "explicit DTMO control crosswalk",
                  "typed mapping relationships and authoritative sources",
                  "human review state",
                  "append-only audit trail",
                  "coverage and provenance drill-down",
              ],
              "claim_boundary": (
                  "Only explicit provenance-backed relationships are displayed. Intelligence mappings remain "
                  "human-reviewed; DTMO control crosswalk relationships do not constitute certification or full "
                  "framework compliance. Missing relationships remain unmapped and no semantic crosswalk is inferred."
              ),
          }
          Path("evidence/e5-e7-framework-governance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e5-e7-framework-governance-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/e5-e7-framework-governance.json
