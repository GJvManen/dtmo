name: RC10 API Error Alerting Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-error-alerting:
    runs-on: ubuntu-24.04
    env:
      DTMO_ENVIRONMENT: development
      DTMO_FEATURE_LIVE_CONNECTORS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Execute RC10.5 controlled API error alerting gate
        run: |
          mkdir -p artifacts
          python -m pytest -q backend/tests/test_rc10_5_api_error_alerting.py \
            --junitxml=artifacts/api-error-alerting.xml \
            | tee artifacts/api-error-alerting-pytest.log
      - name: Record exact-head machine-readable API alerting evidence
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "decision": "pass",
              "exact_head": os.environ["EXACT_HEAD"],
              "objective": "bounded controlled API-error alerting",
              "controls": {
                  "route_template_only_labels": True,
                  "consecutive_5xx_raise_threshold": 3,
                  "consecutive_non_5xx_clear_threshold": 2,
                  "prometheus_alert_metric": True,
                  "prometheus_alert_rule": True,
                  "structured_correlation_evidence": True,
                  "actionable_operator_guidance": True,
                  "recovery_clear_behavior": True,
                  "repeat_raise_suppression": True,
                  "raw_request_data_not_observed": True,
              },
              "governance": {
                  "publication_approval_changed": False,
                  "production_data_used": False,
              },
              "claim_boundary": {
                  "notification_delivery_complete": False,
                  "search_health_alerting_complete": False,
                  "distributed_tracing_complete": False,
                  "dashboards_complete": False,
                  "runbooks_complete": False,
                  "on_call_handover_complete": False,
                  "phase_7_complete": False,
              },
          }
          Path("artifacts/api-error-alerting-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Validate API error alerting evidence contract
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path("artifacts/api-error-alerting-evidence.json").read_text(encoding="utf-8")
          )
          assert evidence["decision"] == "pass"
          assert evidence["exact_head"] == os.environ["EXPECTED_HEAD"]
          controls = evidence["controls"]
          assert controls["consecutive_5xx_raise_threshold"] == 3
          assert controls["consecutive_non_5xx_clear_threshold"] == 2
          assert all(value is True for key, value in controls.items() if key not in {
              "consecutive_5xx_raise_threshold", "consecutive_non_5xx_clear_threshold"
          })
          assert evidence["governance"]["publication_approval_changed"] is False
          assert evidence["governance"]["production_data_used"] is False
          assert not any(evidence["claim_boundary"].values())
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-error-alerting-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  api-error-alerting-gate:
    if: always()
    needs: [api-error-alerting]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed API error alerting evidence
        env:
          RESULT: ${{ needs.api-error-alerting.result }}
        run: test "$RESULT" = "success"
