name: Phase 11 Capacity Resource Planning Gate

'on':
  pull_request:
    paths:
      - 'deploy/helm/dtmo/**'
      - 'docs/architecture/PHASE11_8H_CAPACITY_RESOURCE_PLANNING.md'
      - 'backend/tests/test_phase11_8h_capacity_contract.py'
      - '.github/workflows/phase11-capacity-resource-planning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Phase 11.8h contract
        run: python -m pytest -q backend/tests/test_phase11_8h_capacity_contract.py

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Render Helm capacity policy
        run: >-
          helm template dtmo deploy/helm/dtmo
          --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          > /tmp/rendered.yaml

      - name: Require HorizontalPodAutoscaler
        run: grep -q 'kind: HorizontalPodAutoscaler' /tmp/rendered.yaml
