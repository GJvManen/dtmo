name: Phase 11.10q Governance Operations Functional Recovery Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/dtmo/**'
      - 'backend/tests/test_owner_functional_recovery_governance_operations.py'
      - '.github/workflows/phase11-10q-governance-operations-functional-recovery.yml'
      - 'docs/qa/CANONICAL_FUNCTIONAL_BROWSER_MATRIX.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-operations-functional-recovery:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dtmo
          POSTGRES_USER: dtmo
          POSTGRES_PASSWORD: dtmo-governance-operations-recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtmo -d dtmo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DTMO_ENVIRONMENT: development
      DTMO_DATABASE_URL: postgresql+psycopg://dtmo:dtmo-governance-operations-recovery@127.0.0.1:5432/dtmo
      DTMO_FEATURE_LIVE_CONNECTORS: 'false'
      DTMO_FEATURE_INTELOWL_ENRICHMENT: 'false'
      DTMO_FEATURE_CORTEX_ANALYSIS: 'false'
      DTMO_FEATURE_OPENCTI_READ: 'false'
      DTMO_FEATURE_THEHIVE_HANDOFF: 'false'
      DTMO_FEATURE_MISP_CONNECTOR: 'false'
      DTMO_FEATURE_MISP_EXPORT: 'false'
      DTMO_E2E_BASE_URL: http://127.0.0.1:8766
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build exact-head canonical workbench
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'

      - name: Create exact-head database schema
        run: alembic upgrade head

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Start exact-head DTMO with built workbench
        shell: bash
        run: |
          mkdir -p artifacts
          DTMO_FRONTEND_DIST="$PWD/frontend/dist" uvicorn dtmo.main:app --app-dir backend --host 127.0.0.1 --port 8766 > artifacts/phase11-10q-governance-operations-server.log 2>&1 &
          echo $! > artifacts/phase11-10q-governance-operations-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8766/health > artifacts/phase11-10q-governance-operations-health.json; then exit 0; fi
            sleep 1
          done
          cat artifacts/phase11-10q-governance-operations-server.log
          exit 1

      - name: Execute governance and operations browser journeys
        run: |
          python -m pytest -q backend/tests/test_owner_functional_recovery_governance_operations.py \
            --junitxml=artifacts/phase11-10q-governance-operations-browser.xml

      - name: Record bounded evidence claim
        if: always()
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "workflow": "Phase 11.10q Governance Operations Functional Recovery Gate",
              "exact_head": os.environ["EXACT_HEAD"],
              "same_origin_http": True,
              "repository_backed_governance": True,
              "read_only_runtime_observation": True,
              "legacy_primary_navigation": False,
              "compliance_approval": False,
              "production_health_assurance": False,
              "owner_functional_acceptance": False,
              "staging_evidence": False,
              "production_equivalent_evidence": False,
              "penetration_test_evidence": False,
              "external_assurance_evidence": False,
              "production_authorization": False,
              "claim_boundary": "Exact-head repository-controlled same-origin browser proof that Governance & Evidence renders explicit repository mappings and authority boundaries and Operations renders read-only process/runtime observations with canonical pivots. This does not establish compliance approval, production health assurance, owner acceptance, staging, production-equivalent validation, penetration-test evidence, independent assurance or production authorization."
          }
          Path("artifacts/phase11-10q-governance-operations-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Stop exact-head services
        if: always()
        run: |
          if test -f artifacts/phase11-10q-governance-operations-server.pid; then kill "$(cat artifacts/phase11-10q-governance-operations-server.pid)" || true; fi

      - name: Upload governance and operations recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase11-10q-governance-operations-functional-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
