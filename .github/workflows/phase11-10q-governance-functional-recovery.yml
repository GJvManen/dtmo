name: Phase 11.10q Governance Functional Recovery Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/dtmo/governance_knowledge.py'
      - 'backend/dtmo/governance_crosswalk.py'
      - 'backend/tests/test_phase11_10l_governance_evidence_contract.py'
      - 'backend/tests/test_owner_functional_recovery_governance.py'
      - '.github/workflows/phase11-10q-governance-functional-recovery.yml'
      - 'docs/qa/CANONICAL_FUNCTIONAL_BROWSER_MATRIX.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-functional-recovery:
    runs-on: ubuntu-24.04
    env:
      DTMO_ENVIRONMENT: development
      DTMO_DATABASE_URL: postgresql+psycopg://dtmo@127.0.0.1:1/dtmo
      DTMO_OPENSEARCH_URL: http://127.0.0.1:1
      DTMO_FEATURE_LIVE_CONNECTORS: 'false'
      DTMO_FEATURE_OPENCVE_CONNECTOR: 'false'
      DTMO_FEATURE_VULNERABILITY_LOOKUP_CONNECTOR: 'false'
      DTMO_FEATURE_MISP_CONNECTOR: 'false'
      DTMO_FEATURE_MISP_EXPORT: 'false'
      DTMO_FEATURE_AIL_CONNECTOR: 'false'
      DTMO_FEATURE_TARANIS_CONNECTOR: 'false'
      DTMO_FEATURE_INTELOWL_ENRICHMENT: 'false'
      DTMO_FEATURE_CORTEX_ANALYSIS: 'false'
      DTMO_FEATURE_OPENCTI_READ: 'false'
      DTMO_FEATURE_THEHIVE_HANDOFF: 'false'
      DTMO_E2E_BASE_URL: http://127.0.0.1:8766
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build exact-head canonical workbench
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Validate repository governance contracts
        run: pytest -q backend/tests/test_phase11_10l_governance_evidence_contract.py

      - name: Start exact-head DTMO with built workbench
        shell: bash
        run: |
          mkdir -p artifacts
          DTMO_FRONTEND_DIST="$PWD/frontend/dist" \
            uvicorn dtmo.main:app --app-dir backend --host 127.0.0.1 --port 8766 \
            > artifacts/phase11-10q-governance-server.log 2>&1 &
          echo $! > artifacts/phase11-10q-governance-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8766/health > artifacts/phase11-10q-governance-health.json; then exit 0; fi
            sleep 1
          done
          cat artifacts/phase11-10q-governance-server.log
          exit 1

      - name: Execute governance deep evidence browser journey
        run: |
          pytest -q backend/tests/test_owner_functional_recovery_governance.py \
            --junitxml=artifacts/phase11-10q-governance-browser.xml

      - name: Record bounded evidence claim
        if: always()
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "workflow": "Phase 11.10q Governance Functional Recovery Gate",
              "exact_head": os.environ["EXACT_HEAD"],
              "same_origin_http": True,
              "repository_backed_governance": True,
              "typed_control_crosswalk_visible": True,
              "framework_provenance_visible": True,
              "implementation_refs_visible": True,
              "compliance_inferred": False,
              "external_share_authority": False,
              "publication_authority": False,
              "production_authority": False,
              "owner_functional_acceptance": False,
              "production_equivalent_evidence": False,
              "external_assurance_evidence": False,
              "claim_boundary": "Exact-head repository-controlled browser proof that canonical Governance exposes explicit framework mappings, implementation references, provenance and authority boundaries. It does not prove compliance, control effectiveness, owner acceptance, production-equivalent validation or independent assurance."
          }
          Path("artifacts/phase11-10q-governance-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Stop exact-head service
        if: always()
        run: |
          if test -f artifacts/phase11-10q-governance-server.pid; then kill "$(cat artifacts/phase11-10q-governance-server.pid)" || true; fi

      - name: Upload Governance recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase11-10q-governance-functional-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
