name: Phase 11 HA and Disruption Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deploy/helm/dtmo/**'
      - 'backend/tests/test_phase11_8d_ha_disruption.py'
      - 'docs/architecture/PHASE11_8D_HA_DISRUPTION.md'
      - 'docs/operations/PHASE11_8D_HA_DISRUPTION_RUNBOOK.md'
      - 'docs/qa/PHASE11_8D_HA_DISRUPTION_GATE.md'
      - '.github/workflows/phase11-ha-disruption.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact-head checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Validate HA and disruption contract
        run: python -m pytest backend/tests/test_phase11_8d_ha_disruption.py
