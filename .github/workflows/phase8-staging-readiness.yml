name: Phase 8 Staging Readiness Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Execute staging readiness contract tests
        run: |
          mkdir -p artifacts
          python -m pytest -q backend/tests/test_phase8_staging_readiness.py \
            --junitxml=artifacts/phase8-staging-readiness.xml \
            | tee artifacts/phase8-staging-readiness-pytest.log
      - name: Record exact-head evidence
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
            "decision": "pass",
            "exact_head": os.environ["EXACT_HEAD"],
            "objective": "Phase 8 staging readiness baseline",
            "controls": {
              "deployment_parity_contract_defined": True,
              "secrets_identity_controls_defined": True,
              "tls_network_controls_defined": True,
              "staging_test_evidence_matrix_defined": True,
              "rbac_preserved": True,
              "human_share_approval_preserved": True,
              "fail_closed_acceptance_rule_defined": True
            },
            "claim_boundary": {
              "staging_environment_exists": False,
              "deployment_parity_proven": False,
              "staging_tests_executed": False,
              "phase_8_complete": False,
              "production_acceptance_complete": False
            }
          }
          Path("artifacts/phase8-staging-readiness-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Validate evidence contract
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          e = json.loads(Path("artifacts/phase8-staging-readiness-evidence.json").read_text())
          assert e["decision"] == "pass"
          assert e["exact_head"] == os.environ["EXPECTED_HEAD"]
          assert all(e["controls"].values())
          assert not any(e["claim_boundary"].values())
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase8-staging-readiness-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  staging-readiness-gate:
    if: always()
    needs: [staging-readiness]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed evidence
        env:
          RESULT: ${{ needs.staging-readiness.result }}
        run: test "$RESULT" = "success"
