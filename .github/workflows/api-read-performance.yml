name: RC8 API Read Performance Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-read-performance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Run RC8.2 performance regressions
        run: |
          mkdir -p artifacts
          python -m pytest -q backend/tests/test_rc8_api_read_performance.py --junitxml=artifacts/api-read-performance-tests.xml
      - name: Start bounded DTMO API target
        run: |
          python -m uvicorn dtmo.main:app --host 127.0.0.1 --port 8765 > artifacts/api-server.log 2>&1 &
          echo $! > artifacts/api-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/api-server.log
          exit 1
      - name: Execute bounded API read load
        run: |
          python -m dtmo.performance.api_read \
            --target-url http://127.0.0.1:8765/health \
            --profile config/performance/phase5_workload_profile.json \
            --duration-seconds 5 \
            --concurrency 50 \
            --output artifacts/api-read-performance-evidence.json
      - name: Stop API target
        if: always()
        run: |
          if test -f artifacts/api-server.pid; then
            kill "$(cat artifacts/api-server.pid)" || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-read-performance-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  api-read-performance-gate:
    if: always()
    needs: [api-read-performance]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed API-read evidence
        env:
          API_READ_RESULT: ${{ needs.api-read-performance.result }}
        run: test "$API_READ_RESULT" = "success"
