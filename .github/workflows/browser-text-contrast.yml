name: RC9 Text Contrast Accessibility Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-contrast-e2e:
    runs-on: ubuntu-24.04
    env:
      DTMO_ENVIRONMENT: development
      DTMO_FEATURE_LIVE_CONNECTORS: "false"
      DTMO_E2E_BASE_URL: http://127.0.0.1:8765
      DTMO_CONTRAST_EVIDENCE_PATH: artifacts/browser-text-contrast-measurements.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Start bounded DTMO contrast target
        run: |
          mkdir -p artifacts
          python -m uvicorn dtmo.main:app --host 127.0.0.1 --port 8765 > artifacts/text-contrast-server.log 2>&1 &
          echo $! > artifacts/text-contrast-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/text-contrast-server.log
          exit 1
      - name: Execute RC9.11 measured text contrast
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m pytest -q backend/tests/test_rc9_11_text_contrast.py --junitxml=artifacts/browser-text-contrast.xml
      - name: Validate machine-readable contrast evidence
        if: success()
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = json.loads(Path('artifacts/browser-text-contrast-measurements.json').read_text(encoding='utf-8'))
          assert evidence['decision'] == 'pass'
          assert evidence['exact_head'] == os.environ['EXPECTED_HEAD']
          assert evidence['wcag_success_criterion'] == '1.4.3 Contrast (Minimum)'
          assert evidence['covered_surfaces'] == ['share_approval', 'analyst_search', 'ciso_token_revocation', 'auditor_read_only']
          assert evidence['normal_text_minimum_ratio'] == 4.5
          assert evidence['large_text_minimum_ratio'] == 3.0
          assert evidence['backend_session_rbac_real'] is True
          assert evidence['human_share_approval_preserved'] is True
          assert evidence['non_text_contrast_claimed'] is False
          assert evidence['product_wide_wcag_2_2_aa_claimed'] is False
          assert all(row['pass'] for surface in evidence['surfaces'] for row in surface['measurements'])
          PY
      - name: Stop contrast target
        if: always()
        run: |
          if test -f artifacts/text-contrast-server.pid; then
            kill "$(cat artifacts/text-contrast-server.pid)" || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-text-contrast-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  text-contrast-gate:
    if: always()
    needs: [text-contrast-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed contrast evidence
        env:
          RESULT: ${{ needs.text-contrast-e2e.result }}
        run: test "$RESULT" = "success"
