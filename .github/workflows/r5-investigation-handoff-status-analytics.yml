name: R5 Investigation Handoff Status Analytics Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/VisualAnalyticsWorkspace.tsx'
      - 'backend/dtmo/command_center.py'
      - 'backend/dtmo/persistence/thehive.py'
      - 'tests/test_r5_investigation_handoff_status_analytics.py'
      - 'docs/roadmap/PHASE11_FUNCTIONAL_UX_RECOVERY_PLAN.md'
      - 'docs/development/runs/RUN-20260828-394.md'
      - '.github/workflows/r5-investigation-handoff-status-analytics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependency graph
        working-directory: frontend
        run: npm ci
      - name: Build canonical workbench
        working-directory: frontend
        run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install gate test dependency
        run: python -m pip install pytest
      - name: Verify R5 investigation handoff status contract
        run: python -m pytest -q tests/test_r5_investigation_handoff_status_analytics.py tests/test_r5_connector_execution_state_analytics.py
      - name: Record evidence boundary
        if: always()
        run: |
          printf '%s\n' 'Repository-controlled persisted TheHive handoff-status analytics only; durable handoff states do not establish upstream case completeness, responder execution, local compromise, external-share authority, publication authority, staging, production-equivalent operation, penetration-test results, independent assurance, or production authorization.'
