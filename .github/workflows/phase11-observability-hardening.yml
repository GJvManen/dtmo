name: Phase 11 Observability Hardening Gate

on:
  pull_request:
    paths:
      - 'deploy/helm/dtmo/**'
      - 'docs/architecture/PHASE11_8E_OBSERVABILITY_HARDENING.md'
      - 'docs/operations/PHASE11_8E_OBSERVABILITY_RUNBOOK.md'
      - 'docs/qa/PHASE11_8E_OBSERVABILITY_GATE.md'
      - 'tests/test_phase11_8e_observability_contract.py'
      - '.github/workflows/phase11-observability-hardening.yml'

permissions:
  contents: read

jobs:
  observability-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Phase 11.8e contract
        run: pytest -q tests/test_phase11_8e_observability_contract.py
