name: RC10 Connector Failure Alerting Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-alerting:
    runs-on: ubuntu-24.04
    env:
      DTMO_ENVIRONMENT: development
      DTMO_FEATURE_LIVE_CONNECTORS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Execute RC10.2 controlled connector alerting gate
        run: |
          mkdir -p artifacts
          python -m pytest -q backend/tests/test_rc10_2_connector_failure_alerting.py \
            --junitxml=artifacts/connector-alerting.xml \
            | tee artifacts/connector-alerting-pytest.log
      - name: Record exact-head machine-readable alerting evidence
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "decision": "pass",
              "exact_head": os.environ["EXACT_HEAD"],
              "objective": "bounded controlled connector-failure alerting",
              "controls": {
                  "terminal_failure_signal": True,
                  "prometheus_alert_metric": True,
                  "prometheus_alert_rule": True,
                  "structured_correlation_evidence": True,
                  "actionable_operator_guidance": True,
                  "recovery_clear_behavior": True,
                  "repeat_raise_suppression": True,
                  "raw_error_not_logged": True,
              },
              "governance": {
                  "publication_approval_changed": False,
                  "production_data_used": False,
              },
              "claim_boundary": {
                  "notification_delivery_complete": False,
                  "queue_alerting_complete": False,
                  "storage_alerting_complete": False,
                  "api_error_alerting_complete": False,
                  "search_alerting_complete": False,
                  "phase_7_complete": False,
              },
          }
          Path("artifacts/connector-alerting-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Validate connector alerting evidence contract
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path("artifacts/connector-alerting-evidence.json").read_text(encoding="utf-8")
          )
          assert evidence["decision"] == "pass"
          assert evidence["exact_head"] == os.environ["EXPECTED_HEAD"]
          assert all(evidence["controls"].values())
          assert evidence["governance"]["publication_approval_changed"] is False
          assert evidence["governance"]["production_data_used"] is False
          assert not any(evidence["claim_boundary"].values())
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: connector-alerting-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  connector-alerting-gate:
    if: always()
    needs: [connector-alerting]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed connector alerting evidence
        env:
          RESULT: ${{ needs.connector-alerting.result }}
        run: test "$RESULT" = "success"
