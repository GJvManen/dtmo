name: RC9 Session Status Accessibility Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-status-e2e:
    runs-on: ubuntu-24.04
    env:
      DTMO_ENVIRONMENT: development
      DTMO_DATABASE_URL: postgresql+psycopg://dtmo:dtmo@127.0.0.1:5432/dtmo
      DTMO_REDIS_URL: redis://127.0.0.1:6379/0
      DTMO_OPENSEARCH_URL: http://127.0.0.1:9200
      DTMO_MINIO_ENDPOINT: 127.0.0.1:9000
      DTMO_FEATURE_LIVE_CONNECTORS: "false"
      DTMO_E2E_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Start bounded DTMO session-status target
        run: |
          mkdir -p artifacts
          python -m uvicorn dtmo.main:app --host 127.0.0.1 --port 8765 > artifacts/session-status-server.log 2>&1 &
          echo $! > artifacts/session-status-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/session-status-server.log
          exit 1
      - name: Execute A11Y-001 regression
        run: |
          python -m pytest -q backend/tests/test_rc9_10_a11y_session_status.py \
            --junitxml=artifacts/browser-a11y-session-status.xml
      - name: Record machine-readable A11Y-001 evidence
        if: success()
        env:
          GITHUB_SHA_VALUE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "decision": "pass",
              "exact_head": os.environ["GITHUB_SHA_VALUE"],
              "finding": "A11Y-001",
              "browser": "chromium",
              "covered_surfaces": [
                  "share_approval",
                  "analyst_search",
                  "ciso_token_revocation",
                  "auditor_read_only",
              ],
              "checks": [
                  "principal_role_status",
                  "principal_aria_live_polite",
                  "principal_aria_atomic_true",
                  "async_session_text_resolved",
                  "rbac_governed_control_visible",
              ],
              "backend_session_rbac_real": True,
              "human_share_approval_preserved": True,
              "assistive_technology_behavior_claimed": False,
              "product_wide_wcag_claimed": False,
              "production_data_used": False,
          }
          Path("artifacts/browser-a11y-session-status-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Stop session-status target
        if: always()
        run: |
          if test -f artifacts/session-status-server.pid; then
            kill "$(cat artifacts/session-status-server.pid)" || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-a11y-session-status-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  session-status-gate:
    if: always()
    needs: [session-status-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed A11Y-001 evidence
        env:
          SESSION_STATUS_RESULT: ${{ needs.session-status-e2e.result }}
        run: test "$SESSION_STATUS_RESULT" = "success"
