name: RC9 Auditor Read-only Browser E2E Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditor-readonly-e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dtmo
          POSTGRES_USER: dtmo
          POSTGRES_PASSWORD: dtmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtmo -d dtmo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DTMO_ENVIRONMENT: development
      DTMO_DATABASE_URL: postgresql+psycopg://dtmo:dtmo@127.0.0.1:5432/dtmo
      DTMO_REDIS_URL: redis://127.0.0.1:6379/0
      DTMO_OPENSEARCH_URL: http://127.0.0.1:9200
      DTMO_MINIO_ENDPOINT: 127.0.0.1:9000
      DTMO_FEATURE_LIVE_CONNECTORS: "false"
      DTMO_E2E_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Start bounded DTMO auditor browser target
        run: |
          mkdir -p artifacts
          python -m uvicorn dtmo.main:app --host 127.0.0.1 --port 8765 > artifacts/auditor-browser-e2e-server.log 2>&1 &
          echo $! > artifacts/auditor-browser-e2e-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/auditor-browser-e2e-server.log
          exit 1
      - name: Execute RC9.4 auditor browser journey
        run: |
          python -m pytest -q backend/tests/test_rc9_4_browser_auditor_readonly.py \
            --junitxml=artifacts/browser-auditor-readonly-e2e.xml
      - name: Record machine-readable auditor browser evidence
        if: success()
        env:
          GITHUB_SHA_VALUE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "decision": "pass",
              "exact_head": os.environ["GITHUB_SHA_VALUE"],
              "journey": "auditor_read_only_audit_evidence",
              "browser": "chromium",
              "ui_permissions_backend_derived": True,
              "read_audit_permission_required": True,
              "analyst_control_hidden": True,
              "analyst_direct_api_denied": True,
              "persistent_audit_records_rendered": True,
              "audit_chain_verified": True,
              "browser_read_does_not_mutate_audit_records": True,
              "synthetic_fixture_only": True,
          }
          Path("artifacts/browser-auditor-readonly-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Stop browser target
        if: always()
        run: |
          if test -f artifacts/auditor-browser-e2e-server.pid; then
            kill "$(cat artifacts/auditor-browser-e2e-server.pid)" || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-auditor-readonly-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  auditor-readonly-gate:
    if: always()
    needs: [auditor-readonly-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed auditor browser evidence
        env:
          AUDITOR_RESULT: ${{ needs.auditor-readonly-e2e.result }}
        run: test "$AUDITOR_RESULT" = "success"
