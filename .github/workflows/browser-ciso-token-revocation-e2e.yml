name: RC9 CISO Token Revocation Browser E2E Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ciso-token-revocation-e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dtmo
          POSTGRES_USER: dtmo
          POSTGRES_PASSWORD: dtmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtmo -d dtmo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DTMO_ENVIRONMENT: development
      DTMO_DATABASE_URL: postgresql+psycopg://dtmo:dtmo@127.0.0.1:5432/dtmo
      DTMO_REDIS_URL: redis://127.0.0.1:6379/0
      DTMO_OPENSEARCH_URL: http://127.0.0.1:9200
      DTMO_MINIO_ENDPOINT: 127.0.0.1:9000
      DTMO_FEATURE_LIVE_CONNECTORS: "false"
      DTMO_CISO_E2E_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Start bounded DTMO CISO browser target
        run: |
          mkdir -p artifacts
          python -m uvicorn dtmo.main:app --host 127.0.0.1 --port 8765 > artifacts/browser-ciso-server.log 2>&1 &
          echo $! > artifacts/browser-ciso-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/browser-ciso-server.log
          exit 1
      - name: Execute RC9.3 CISO browser journey
        run: |
          python -m pytest -q backend/tests/test_rc9_3_browser_ciso_token_revocation.py \
            --junitxml=artifacts/browser-ciso-token-revocation.xml
      - name: Record machine-readable CISO browser evidence
        if: success()
        env:
          GITHUB_SHA_VALUE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "decision": "pass",
              "exact_head": os.environ["GITHUB_SHA_VALUE"],
              "journey": "ciso_governed_token_revocation",
              "browser": "chromium",
              "ciso_control_backend_derived": True,
              "analyst_control_hidden": True,
              "analyst_direct_api_denied": True,
              "ciso_revocation_succeeds": True,
              "redis_revocation_verified": True,
              "persistent_audit_chain_verified": True,
              "publication_or_share_behavior_changed": False,
          }
          Path("artifacts/browser-ciso-token-revocation-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Stop browser target
        if: always()
        run: |
          if test -f artifacts/browser-ciso-server.pid; then
            kill "$(cat artifacts/browser-ciso-server.pid)" || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-ciso-token-revocation-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  browser-ciso-token-revocation-gate:
    if: always()
    needs: [browser-ciso-token-revocation-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed CISO browser evidence
        env:
          CISO_BROWSER_RESULT: ${{ needs.browser-ciso-token-revocation-e2e.result }}
        run: test "$CISO_BROWSER_RESULT" = "success"
