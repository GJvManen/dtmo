name: Phase 11.10q Administration Security Audit Recovery Gate

on:
  pull_request:
    paths:
      - 'frontend/src/AdministrationSecurityAudit.tsx'
      - 'frontend/src/main.tsx'
      - 'backend/dtmo/api/routes.py'
      - 'backend/dtmo/auditor_ui.py'
      - 'backend/tests/test_phase11_10q_administration_security_audit.py'
      - 'docs/architecture/PHASE11_10Q_ADMINISTRATION_SECURITY_AUDIT.md'
      - 'docs/roadmap/FUNCTIONAL_RECOVERY_ACCEPTANCE.md'
      - '.github/workflows/phase11-10q-administration-security-audit.yml'

permissions:
  contents: read

jobs:
  administration-security-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical workbench
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate canonical security and audit administration
        run: python -m pytest -q backend/tests/test_phase11_10q_administration_security_audit.py
