name: Phase 11.10q1 Capability Interface Matrix Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic test dependency
        run: python -m pip install pytest
      - name: Validate capability-to-interface traceability
        run: python -m pytest -q backend/tests/test_phase11_10q1_capability_interface_matrix.py
