name: Phase 11.10p Production-Equivalent Validation Contract Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/architecture/PHASE11_10P_PRODUCTION_EQUIVALENT_VALIDATION.md'
      - 'tests/test_phase11_10p_production_equivalent_validation.py'
      - '.github/workflows/phase11-10p-production-equivalent-validation.yml'
      - 'docs/**'
      - 'dtmo/**'
      - 'frontend/**'
      - 'web/**'

permissions:
  contents: read

jobs:
  production-equivalent-validation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Phase 11.10p deterministic contract tests
        run: python -m pytest -q tests/test_phase11_10p_production_equivalent_validation.py
