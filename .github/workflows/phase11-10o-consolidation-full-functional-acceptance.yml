name: Phase 11 Consolidation Full Functional Acceptance Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/architecture/PHASE11_10O_CONSOLIDATION_FULL_FUNCTIONAL_ACCEPTANCE.md'
      - 'tests/test_phase11_10o_consolidation_full_functional_acceptance.py'
      - '.github/workflows/phase11-10o-consolidation-full-functional-acceptance.yml'
      - 'dtmo/**'
      - 'frontend/**'
      - 'web/**'
      - 'docs/**'

permissions:
  contents: read

jobs:
  consolidation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Phase 11.10o deterministic contract tests
        run: python -m pytest -q tests/test_phase11_10o_consolidation_full_functional_acceptance.py
