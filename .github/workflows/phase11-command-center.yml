name: Phase 11 Command Center Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/dtmo/command_center.py'
      - 'backend/dtmo/api_command_center.py'
      - 'backend/dtmo/workbench_frontend.py'
      - 'backend/tests/test_phase11_10c_command_center_*.py'
      - '.github/workflows/phase11-command-center.yml'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-command-center:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact frontend dependency graph
        working-directory: frontend
        run: npm ci

      - name: Verify dependency manifests remain immutable
        run: git diff --exit-code -- frontend/package.json frontend/package-lock.json

      - name: Typecheck and build canonical workbench
        working-directory: frontend
        run: npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run Phase 11.10c repository contract
        run: python -m pytest -q backend/tests/test_phase11_10c_command_center_contract.py

      - name: Install Chromium for browser acceptance
        run: python -m playwright install chromium

      - name: Start exact-head DTMO with built workbench
        shell: bash
        run: |
          DTMO_FRONTEND_DIST="$PWD/frontend/dist" uvicorn dtmo.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/dtmo-command-center.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dtmo-command-center.log
          exit 1

      - name: Run Command Center browser acceptance
        env:
          DTMO_BROWSER_BASE_URL: http://127.0.0.1:8000
        run: python -m pytest -q backend/tests/test_phase11_10c_command_center_browser.py

      - name: Record repository evidence boundary
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "workflow": "Phase 11 Command Center Gate",
              "sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "scope": "Phase 11.10c canonical Command Center",
              "claim_boundary": (
                  "Repository-controlled evidence for the exact-head read model, frontend build, "
                  "fail-closed canonical-store behavior, role-aware visibility and browser rendering. "
                  "It does not establish upstream service health, production-equivalent operation, "
                  "independent assurance or production authorization."
              ),
          }
          Path("artifacts/phase11-10c-command-center.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload non-sensitive Command Center evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase11-10c-command-center-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: error
