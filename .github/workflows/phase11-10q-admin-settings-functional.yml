name: Phase 11.10q Administration Settings Functional Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic test dependencies
        run: python -m pip install pytest fastapi pydantic pydantic-settings sqlalchemy prometheus-client
      - name: Validate actionable governed integration settings
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_phase11_10q_admin_integration_settings.py
