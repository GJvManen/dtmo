name: Phase 11.10q Collection Control Plane Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collection-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend test dependency graph
        run: python -m pip install -e '.[test]'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build canonical workbench
        working-directory: frontend
        run: npm run build
      - name: Validate complete Sources & Collection operator journey
        run: python -m pytest -q backend/tests/test_phase11_10q_collection_control_plane_contract.py
