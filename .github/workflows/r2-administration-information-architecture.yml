name: R2 Administration Information Architecture Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/AdministrationConsole.tsx'
      - 'frontend/src/main.tsx'
      - 'tests/test_r2_administration_information_architecture.py'
      - 'docs/qa/R2_ADMINISTRATION_INFORMATION_ARCHITECTURE.md'
      - 'docs/development/runs/RUN-20260827-380.md'
      - '.github/workflows/r2-administration-information-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact frontend dependency graph
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build canonical workbench
        working-directory: frontend
        run: npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install contract test dependency
        run: python -m pip install pytest

      - name: Verify R2 administration console contract
        run: python -m pytest -q tests/test_r2_administration_information_architecture.py

      - name: Record bounded evidence statement
        if: always()
        run: |
          echo 'R2 gate is repository-controlled engineering evidence only; it does not establish owner acceptance, production-equivalent operation, penetration-test results, independent assurance or production authorization.'
