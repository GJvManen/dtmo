name: R1 Safe Public Bootstrap Gate

on:
  pull_request:
    paths:
      - ".env.example"
      - "tests/test_local_bootstrap.py"
      - "docs/installation/INSTALLATION_GUIDE.md"
      - "docs/development/runs/RUN-20260827-379.md"
      - ".github/workflows/r1-safe-public-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install gate test dependency
        run: python -m pip install pytest
      - name: Verify safe public local/reference defaults
        run: python -m pytest -q tests/test_local_bootstrap.py
      - name: Verify fail-closed external integration boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          env = Path('.env.example').read_text(encoding='utf-8')
          required = {
              'DTMO_FEATURE_LIVE_CONNECTORS=true',
              'DTMO_FEATURE_VULNERABILITY_LOOKUP_CONNECTOR=true',
              'DTMO_FEATURE_OPENCVE_CONNECTOR=false',
              'DTMO_FEATURE_OPENCTI_READ=false',
          }
          missing = sorted(item for item in required if item not in env)
          if missing:
              raise SystemExit(f'missing R1 defaults: {missing}')
          for marker in (
              'DTMO_FEATURE_MISP_CONNECTOR=true',
              'DTMO_FEATURE_AIL_CONNECTOR=true',
              'DTMO_FEATURE_TARANIS_CONNECTOR=true',
              'DTMO_FEATURE_INTELOWL_ENRICHMENT=true',
              'DTMO_FEATURE_CORTEX_ANALYSIS=true',
              'DTMO_FEATURE_THEHIVE_HANDOFF=true',
          ):
              if marker in env:
                  raise SystemExit(f'credential-bearing integration must not be enabled by R1 default: {marker}')
          print('PASS: R1 safe public defaults remain bounded')
          PY
