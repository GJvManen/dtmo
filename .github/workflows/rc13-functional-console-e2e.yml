name: RC13 Functional Console Browser E2E Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-console-e2e:
    runs-on: ubuntu-24.04
    env:
      DTMO_ENVIRONMENT: development
      DTMO_E2E_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Install Chromium for Playwright
        run: python -m playwright install chromium
      - name: Start bounded DTMO console browser target
        run: |
          mkdir -p artifacts
          python -m uvicorn dtmo.main:app --host 127.0.0.1 --port 8765 > artifacts/rc13-console-server.log 2>&1 &
          echo $! > artifacts/rc13-console-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/rc13-console-server.log
          exit 1
      - name: Execute RC13.1 functional console journey
        run: |
          python -m pytest -q backend/tests/test_rc13_1_unified_console_browser_e2e.py \
            --junitxml=artifacts/rc13-functional-console-e2e.xml
      - name: Record machine-readable RC13 evidence
        if: success()
        env:
          GITHUB_SHA_VALUE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "decision": "pass",
              "exact_head": os.environ["GITHUB_SHA_VALUE"],
              "journey": "source_register_enable_run_ingest_recent_intelligence_overview",
              "browser": "chromium",
              "built_in_manual_run_visible": True,
              "framework_registration_clicked": True,
              "framework_enable_clicked": True,
              "framework_run_clicked": True,
              "ingest_result_rendered": True,
              "recent_intelligence_rendered": True,
              "overview_statistics_updated": True,
              "legacy_menu_notice_absent": True,
              "synthetic_browser_fixtures_only": True,
          }
          Path("artifacts/rc13-functional-console-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Stop browser target
        if: always()
        run: |
          if test -f artifacts/rc13-console-server.pid; then
            kill "$(cat artifacts/rc13-console-server.pid)" || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc13-functional-console-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  functional-console-gate:
    if: always()
    needs: [functional-console-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed RC13 browser evidence
        env:
          FUNCTIONAL_RESULT: ${{ needs.functional-console-e2e.result }}
        run: test "$FUNCTIONAL_RESULT" = "success"
