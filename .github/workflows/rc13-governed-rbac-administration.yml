name: RC13 Governed Administration RBAC Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rbac-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Verify RC13.3 persistence, authorization and audit contracts
        run: |
          mkdir -p artifacts
          python -m pytest -q backend/tests/test_rc13_3_rbac_administration.py \
            --junitxml=artifacts/rc13-rbac-contract.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc13-rbac-contract-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  rbac-browser:
    runs-on: ubuntu-24.04
    env:
      DTMO_ENVIRONMENT: development
      DTMO_E2E_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Install Chromium for Playwright
        run: python -m playwright install chromium
      - name: Start bounded canonical console target
        run: |
          mkdir -p artifacts
          python -m uvicorn dtmo.main:app --host 127.0.0.1 --port 8765 > artifacts/rc13-rbac-server.log 2>&1 &
          echo $! > artifacts/rc13-rbac-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/rc13-rbac-server.log
          exit 1
      - name: Execute canonical Administration RBAC browser journey
        run: |
          python -m pytest -q backend/tests/test_rc13_3_rbac_administration_browser_e2e.py \
            --junitxml=artifacts/rc13-rbac-browser.xml
      - name: Record machine-readable RC13.3 evidence
        if: success()
        env:
          GITHUB_SHA_VALUE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "decision": "pass",
              "exact_head": os.environ["GITHUB_SHA_VALUE"],
              "journey": "canonical_administration_managed_principal_role_assignment",
              "browser": "chromium",
              "role_catalog_rendered": True,
              "self_management_blocked": True,
              "principal_created": True,
              "role_assignment_updated": True,
              "principal_deactivated": True,
              "request_ids_present": True,
              "token_reconciliation_boundary_visible": True,
              "synthetic_browser_fixtures_only": True,
              "owner_local_acceptance_claimed": False,
          }
          Path("artifacts/rc13-rbac-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Stop browser target
        if: always()
        run: |
          if test -f artifacts/rc13-rbac-server.pid; then
            kill "$(cat artifacts/rc13-rbac-server.pid)" || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc13-rbac-browser-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  rbac-gate:
    if: always()
    needs: [rbac-contract, rbac-browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed RC13.3 evidence
        env:
          CONTRACT_RESULT: ${{ needs.rbac-contract.result }}
          BROWSER_RESULT: ${{ needs.rbac-browser.result }}
        run: |
          test "$CONTRACT_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
