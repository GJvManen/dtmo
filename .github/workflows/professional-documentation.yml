name: Professional Documentation Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  professional-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Validate professional documentation architecture
        run: pytest -q backend/tests/test_professional_documentation_contract.py

      - name: Record exact-head evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "workflow": "Professional Documentation Gate",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "claim_boundary": (
                  "Repository-controlled gate preserving DTMO's stable professional documentation "
                  "building blocks and separating them from operational run/incident chronology. "
                  "It does not establish product, staging, external-assurance or production acceptance."
              ),
          }
          Path("evidence/professional-documentation.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: professional-documentation-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/professional-documentation.json
