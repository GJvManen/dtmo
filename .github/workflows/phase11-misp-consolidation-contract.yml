name: Phase 11 MISP Consolidation Contract Gate

on:
  pull_request:
    paths:
      - 'backend/dtmo/connectors/misp.py'
      - 'backend/dtmo/misp_export_api.py'
      - 'backend/dtmo/governance/misp_export.py'
      - 'docs/architecture/MISP_DTMO_CONSOLIDATION_CONTRACT.md'
      - 'docs/integrations/MISP_READ_INTEGRATION.md'
      - 'docs/intelligence/MISP_GOVERNED_EXPORT.md'
      - 'docs/qa/PHASE11_5_MISP_CONSOLIDATION_CONTRACT_GATE.md'
      - 'docs/roadmap/PLATFORM_INDUSTRIALISATION_ROADMAP.md'
      - 'docs/project/CURRENT_STATE.md'
      - 'docs/security/SECURITY_OVERVIEW.md'
      - 'docs/evidence/EVIDENCE_INDEX.md'
      - 'README.md'
      - 'docs/README.md'
      - 'backend/tests/test_phase11_5_misp_consolidation_contract.py'
      - '.github/workflows/phase11-misp-consolidation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  misp-consolidation-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Validate MISP consolidation contract and authoritative status
        run: >-
          python -m pytest -q
          backend/tests/test_phase11_5_misp_consolidation_contract.py
          backend/tests/test_professional_documentation_contract.py
