name: Phase 11.10q Functional Recovery Blocker Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocker-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Verify owner-rejected workspaces remain explicit release blockers
        run: python -m pytest -q backend/tests/test_phase11_10q_functional_recovery_blockers.py
