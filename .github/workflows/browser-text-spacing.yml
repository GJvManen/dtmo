name: RC9 Text Spacing Accessibility Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-spacing-e2e:
    runs-on: ubuntu-24.04
    env:
      DTMO_ENVIRONMENT: development
      DTMO_FEATURE_LIVE_CONNECTORS: "false"
      DTMO_E2E_BASE_URL: http://127.0.0.1:8765
      DTMO_TEXT_SPACING_EVIDENCE_PATH: artifacts/browser-text-spacing-evidence.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Start bounded DTMO text-spacing target
        run: |
          mkdir -p artifacts
          python -m uvicorn dtmo.main:app --host 127.0.0.1 --port 8765 > artifacts/text-spacing-server.log 2>&1 &
          echo $! > artifacts/text-spacing-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/health.json; then exit 0; fi
            sleep 1
          done
          cat artifacts/text-spacing-server.log
          exit 1
      - name: Execute RC9.14 text-spacing gate
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m pytest -q backend/tests/test_rc9_14_text_spacing.py --junitxml=artifacts/browser-text-spacing.xml
      - name: Validate machine-readable text-spacing evidence
        if: success()
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          e=json.loads(Path('artifacts/browser-text-spacing-evidence.json').read_text())
          assert e['decision']=='pass' and e['exact_head']==os.environ['EXPECTED_HEAD']
          assert e['wcag_success_criterion']=='1.4.12 Text Spacing'
          assert e['override']=={'line_height':'1.5','paragraph_spacing':'2em','letter_spacing':'0.12em','word_spacing':'0.16em'}
          assert e['covered_surfaces']==['share_approval','analyst_search','ciso_token_revocation','auditor_read_only']
          assert e['backend_session_rbac_real'] is True and e['human_share_approval_preserved'] is True
          assert e['assistive_technology_claimed'] is False and e['product_wide_wcag_2_2_aa_claimed'] is False
          for s in e['surfaces']:
              assert s['document_metrics']['clippedText']==[]
              assert all(c['focusable'] for c in s['critical_controls'])
          PY
      - name: Stop text-spacing target
        if: always()
        run: |
          if test -f artifacts/text-spacing-server.pid; then kill "$(cat artifacts/text-spacing-server.pid)" || true; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-text-spacing-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  text-spacing-gate:
    if: always()
    needs: [text-spacing-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed text-spacing evidence
        env:
          RESULT: ${{ needs.text-spacing-e2e.result }}
        run: test "$RESULT" = "success"
