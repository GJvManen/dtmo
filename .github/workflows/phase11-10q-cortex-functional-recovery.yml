name: Phase 11.10q Cortex Functional Recovery Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/dtmo/**'
      - 'backend/tests/test_owner_functional_recovery_cortex.py'
      - '.github/workflows/phase11-10q-cortex-functional-recovery.yml'
      - 'docs/qa/CANONICAL_FUNCTIONAL_BROWSER_MATRIX.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cortex-functional-recovery:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dtmo
          POSTGRES_USER: dtmo
          POSTGRES_PASSWORD: dtmo-cortex-recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtmo -d dtmo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DTMO_ENVIRONMENT: development
      DTMO_DATABASE_URL: postgresql+psycopg://dtmo:dtmo-cortex-recovery@127.0.0.1:5432/dtmo
      DTMO_FEATURE_LIVE_CONNECTORS: 'false'
      DTMO_FEATURE_INTELOWL_ENRICHMENT: 'false'
      DTMO_FEATURE_CORTEX_ANALYSIS: 'true'
      DTMO_CORTEX_API_BASE: http://127.0.0.1:8773
      DTMO_CORTEX_API_TOKEN: repository-controlled-cortex-token
      DTMO_CORTEX_ALLOWED_OBSERVABLE_TYPES: domain
      DTMO_CORTEX_ALLOWED_ANALYZERS: functional_domain
      DTMO_CORTEX_WAIT_SECONDS: '1'
      DTMO_FEATURE_OPENCTI_READ: 'false'
      DTMO_FEATURE_THEHIVE_HANDOFF: 'false'
      DTMO_FEATURE_MISP_CONNECTOR: 'false'
      DTMO_FEATURE_MISP_EXPORT: 'false'
      DTMO_E2E_BASE_URL: http://127.0.0.1:8766
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build exact-head canonical workbench
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'

      - name: Create exact-head database schema
        run: alembic upgrade head

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Start repository-controlled Cortex API emulator
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY' > artifacts/phase11-10q-cortex-emulator.log 2>&1 &
          import json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import urlparse

          TOKEN = "Bearer repository-controlled-cortex-token"
          JOB = "repo-cortex-4242"
          ANALYZER = "functional_domain"

          class Handler(BaseHTTPRequestHandler):
              def _json(self, status, payload):
                  body = json.dumps(payload).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  parsed = urlparse(self.path)
                  if parsed.path == "/health":
                      self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
                  if parsed.path != f"/api/job/{JOB}/waitreport":
                      self.send_response(404); self.end_headers(); return
                  if self.headers.get("Authorization") != TOKEN:
                      self.send_response(403); self.end_headers(); return
                  self._json(200, {
                      "id": JOB,
                      "status": "success",
                      "analyzerId": ANALYZER,
                      "report": {
                          "classification": "repository-controlled",
                          "analyzer_only": True,
                          "responder_action": False,
                      },
                  })

              def do_POST(self):
                  if self.path != f"/api/analyzer/{ANALYZER}/run":
                      self.send_response(404); self.end_headers(); return
                  if self.headers.get("Authorization") != TOKEN:
                      self.send_response(403); self.end_headers(); return
                  length = int(self.headers.get("Content-Length", "0"))
                  payload = json.loads(self.rfile.read(length) or b"{}")
                  valid = (
                      payload.get("dataType") == "domain"
                      and str(payload.get("data", "")).endswith(".example.invalid")
                      and payload.get("tlp") == 2
                      and payload.get("parameters") == {}
                      and str(payload.get("message", "")).startswith("DTMO canonical item ")
                  )
                  if not valid:
                      self._json(422, {"detail": "unexpected governed Cortex request"}); return
                  self._json(201, {"id": JOB})

              def log_message(self, format, *args):
                  print(format % args, flush=True)

          ThreadingHTTPServer(("127.0.0.1", 8773), Handler).serve_forever()
          PY
          echo $! > artifacts/phase11-10q-cortex-emulator.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8773/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/phase11-10q-cortex-emulator.log
          exit 1

      - name: Start exact-head DTMO with built workbench
        shell: bash
        run: |
          mkdir -p artifacts
          DTMO_FRONTEND_DIST="$PWD/frontend/dist" uvicorn dtmo.main:app --app-dir backend --host 127.0.0.1 --port 8766 > artifacts/phase11-10q-cortex-server.log 2>&1 &
          echo $! > artifacts/phase11-10q-cortex-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8766/health > artifacts/phase11-10q-cortex-health.json; then exit 0; fi
            sleep 1
          done
          cat artifacts/phase11-10q-cortex-server.log
          exit 1

      - name: Execute governed Cortex browser journey
        run: |
          python -m pytest -q backend/tests/test_owner_functional_recovery_cortex.py \
            --junitxml=artifacts/phase11-10q-cortex-browser.xml

      - name: Record bounded evidence claim
        if: always()
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "workflow": "Phase 11.10q Cortex Functional Recovery Gate",
              "exact_head": os.environ["EXACT_HEAD"],
              "same_origin_http": True,
              "real_dtmo_persistence": True,
              "repository_controlled_cortex_emulator": True,
              "cortex_analyzer_only": True,
              "cortex_responders_allowed": False,
              "external_share_authorized": False,
              "local_compromise_proven": False,
              "live_cortex_deployment": False,
              "owner_functional_acceptance": False,
              "staging_evidence": False,
              "production_equivalent_evidence": False,
              "external_assurance_evidence": False,
              "claim_boundary": "Exact-head repository-controlled browser proof of the real DTMO server-side Cortex analyzer adapter, allowlist, persistence and reload path against a loopback emulator. This does not prove live Cortex health, upstream truth, compromise, responder authority, owner acceptance, staging, production-equivalent validation or independent assurance."
          }
          Path("artifacts/phase11-10q-cortex-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Stop exact-head services
        if: always()
        run: |
          if test -f artifacts/phase11-10q-cortex-server.pid; then kill "$(cat artifacts/phase11-10q-cortex-server.pid)" || true; fi
          if test -f artifacts/phase11-10q-cortex-emulator.pid; then kill "$(cat artifacts/phase11-10q-cortex-emulator.pid)" || true; fi

      - name: Upload Cortex recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase11-10q-cortex-functional-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
