name: Phase 11.10q Knowledge Graph Discovery Gate

on:
  pull_request:
    paths:
      - 'backend/tests/test_phase11_10q_knowledge_graph_discovery.py'
      - 'frontend/src/OpenCTIGraphWorkspace.tsx'
      - 'docs/architecture/PHASE11_10Q_KNOWLEDGE_GRAPH_RECOVERY.md'
      - '.github/workflows/phase11-10q-knowledge-graph-discovery.yml'

permissions:
  contents: read

jobs:
  knowledge-graph-discovery:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run Knowledge Graph discovery contracts
        run: python -m pytest -q backend/tests/test_phase11_10q_knowledge_graph_discovery.py

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact frontend dependency graph
        working-directory: frontend
        run: npm ci

      - name: Build canonical workbench
        working-directory: frontend
        run: npm run build
