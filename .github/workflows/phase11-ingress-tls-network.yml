name: Phase 11 Ingress TLS and Network Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deploy/helm/dtmo/**'
      - 'backend/tests/test_phase11_8c_ingress_tls_network_segmentation.py'
      - 'docs/architecture/PHASE11_8C_INGRESS_TLS_NETWORK_SEGMENTATION.md'
      - 'docs/administration/INGRESS_TLS_NETWORK_SEGMENTATION.md'
      - 'docs/operations/PHASE11_8C_INGRESS_TLS_NETWORK_SEGMENTATION_RUNBOOK.md'
      - 'docs/qa/PHASE11_8C_INGRESS_TLS_NETWORK_SEGMENTATION_GATE.md'
      - '.github/workflows/phase11-ingress-tls-network.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Validate ingress TLS and network segmentation contract
        run: python -m pytest backend/tests/test_phase11_8c_ingress_tls_network_segmentation.py
