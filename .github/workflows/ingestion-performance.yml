name: RC8 Ingestion Performance Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingestion-performance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Run RC8.4 ingestion performance regressions
        run: |
          mkdir -p artifacts
          python -m pytest -q backend/tests/test_rc8_ingestion_performance.py --junitxml=artifacts/ingestion-performance-tests.xml
      - name: Execute bounded governed ingestion throughput load
        run: |
          python -m dtmo.performance.ingestion \
            --profile config/performance/phase5_workload_profile.json \
            --duration-seconds 5 \
            --output artifacts/ingestion-performance-evidence.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ingestion-performance-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  ingestion-performance-gate:
    if: always()
    needs: [ingestion-performance]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed ingestion evidence
        env:
          INGESTION_RESULT: ${{ needs.ingestion-performance.result }}
        run: test "$INGESTION_RESULT" = "success"
