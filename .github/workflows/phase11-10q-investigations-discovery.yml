name: Phase 11.10q Investigations Discovery Gate

on:
  pull_request:
    paths:
      - 'frontend/src/InvestigationsWorkspace.tsx'
      - 'backend/tests/test_phase11_10q_investigations_discovery.py'
      - 'docs/roadmap/FUNCTIONAL_RECOVERY_ACCEPTANCE.md'
      - '.github/workflows/phase11-10q-investigations-discovery.yml'

permissions:
  contents: read

jobs:
  investigations-discovery:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact-head checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate canonical investigation discovery contract
        run: python -m pytest -q backend/tests/test_phase11_10q_investigations_discovery.py
      - name: Record evidence boundary
        run: echo 'Repository-controlled exact-head contract evidence only; owner functional acceptance remains required.'
