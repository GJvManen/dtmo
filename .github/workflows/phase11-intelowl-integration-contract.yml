name: Phase 11 IntelOwl Integration Contract Gate

on:
  pull_request:
    paths:
      - 'docs/architecture/INTELOWL_DTMO_INTEGRATION_CONTRACT.md'
      - 'docs/roadmap/PLATFORM_INDUSTRIALISATION_ROADMAP.md'
      - 'docs/project/CURRENT_STATE.md'
      - 'README.md'
      - 'backend/tests/test_intelowl_integration_contract.py'
      - '.github/workflows/phase11-intelowl-integration-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intelowl-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Validate IntelOwl contract and authoritative status
        run: python -m pytest -q backend/tests/test_intelowl_integration_contract.py
