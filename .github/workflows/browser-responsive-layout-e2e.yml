name: RC9 Responsive Layout E2E Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-layout-e2e:
    runs-on: ubuntu-24.04
    env:
      DTMO_ENVIRONMENT: development
      DTMO_DATABASE_URL: postgresql+psycopg://dtmo:dtmo@127.0.0.1:5432/dtmo
      DTMO_REDIS_URL: redis://127.0.0.1:6379/0
      DTMO_OPENSEARCH_URL: http://127.0.0.1:9200
      DTMO_MINIO_ENDPOINT: 127.0.0.1:9000
      DTMO_FEATURE_LIVE_CONNECTORS: "false"
      DTMO_E2E_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Start bounded DTMO responsive target
        run: |
          mkdir -p artifacts
          python -m uvicorn dtmo.main:app --host 127.0.0.1 --port 8765 > artifacts/responsive-e2e-server.log 2>&1 &
          echo $! > artifacts/responsive-e2e-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/responsive-e2e-server.log
          exit 1
      - name: Execute RC9.6 responsive critical surfaces
        run: |
          python -m pytest -q backend/tests/test_rc9_6_responsive_layout.py \
            --junitxml=artifacts/browser-responsive-layout-e2e.xml
      - name: Record machine-readable responsive evidence
        if: success()
        env:
          GITHUB_SHA_VALUE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "decision": "pass",
              "exact_head": os.environ["GITHUB_SHA_VALUE"],
              "journey": "accepted_critical_browser_responsive_layout",
              "browser": "chromium",
              "representative_viewports": {
                  "mobile": {"width": 360, "height": 800},
                  "tablet": {"width": 768, "height": 1024},
                  "desktop": {"width": 1440, "height": 900},
              },
              "covered_surfaces": [
                  "share_approval",
                  "analyst_search",
                  "ciso_token_revocation",
                  "auditor_read_only",
              ],
              "blocking_horizontal_overflow": False,
              "interactive_controls_within_viewport": True,
              "minimum_control_dimension_px": 24,
              "backend_session_rbac_real": True,
              "business_mutations_executed": False,
              "production_data_used": False,
              "cross_browser_claimed": False,
              "broad_wcag_2_2_aa_claimed": False,
          }
          Path("artifacts/browser-responsive-layout-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Stop responsive target
        if: always()
        run: |
          if test -f artifacts/responsive-e2e-server.pid; then
            kill "$(cat artifacts/responsive-e2e-server.pid)" || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-responsive-layout-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  responsive-layout-gate:
    if: always()
    needs: [responsive-layout-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed responsive evidence
        env:
          RESPONSIVE_RESULT: ${{ needs.responsive-layout-e2e.result }}
        run: test "$RESPONSIVE_RESULT" = "success"
