name: RC10 Queue Backlog Alerting Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-backlog-alerting:
    runs-on: ubuntu-24.04
    env:
      DTMO_ENVIRONMENT: development
      DTMO_FEATURE_LIVE_CONNECTORS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Execute RC10.3 controlled queue backlog alerting gate
        run: |
          mkdir -p artifacts
          python -m pytest -q backend/tests/test_rc10_3_queue_backlog_alerting.py \
            --junitxml=artifacts/queue-backlog-alerting.xml \
            | tee artifacts/queue-backlog-alerting-pytest.log
      - name: Record exact-head machine-readable queue alert evidence
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "decision": "pass",
              "exact_head": os.environ["EXACT_HEAD"],
              "objective": "bounded queue-backlog alerting",
              "thresholds": {
                  "raise_utilization_ratio": 0.80,
                  "clear_utilization_ratio": 0.50,
              },
              "controls": {
                  "bounded_queue_identifier": True,
                  "backlog_depth_metric": True,
                  "capacity_metric": True,
                  "utilization_metric": True,
                  "threshold_breach_signal": True,
                  "hysteresis_recovery_clear": True,
                  "structured_correlation_evidence": True,
                  "actionable_operator_guidance": True,
                  "rc8_queue_pressure_contract_reused": True,
                  "publication_approval_changed": False,
              },
              "governance": {
                  "production_data_used": False,
                  "queue_items_mutated_by_observer": False,
                  "producer_consumer_policy_changed": False,
              },
              "claim_boundary": {
                  "deployed_queue_service_claimed": False,
                  "notification_delivery_complete": False,
                  "storage_alerting_complete": False,
                  "api_error_alerting_complete": False,
                  "search_alerting_complete": False,
                  "phase_7_complete": False,
              },
          }
          Path("artifacts/queue-backlog-alerting-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Validate queue backlog alerting evidence contract
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path("artifacts/queue-backlog-alerting-evidence.json").read_text(encoding="utf-8")
          )
          assert evidence["decision"] == "pass"
          assert evidence["exact_head"] == os.environ["EXPECTED_HEAD"]
          assert evidence["thresholds"]["raise_utilization_ratio"] == 0.80
          assert evidence["thresholds"]["clear_utilization_ratio"] == 0.50
          assert evidence["controls"]["publication_approval_changed"] is False
          assert all(
              value is True
              for key, value in evidence["controls"].items()
              if key != "publication_approval_changed"
          )
          assert not any(evidence["governance"].values())
          assert not any(evidence["claim_boundary"].values())
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: queue-backlog-alerting-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  queue-backlog-alerting-gate:
    if: always()
    needs: [queue-backlog-alerting]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed queue backlog evidence
        env:
          RESULT: ${{ needs.queue-backlog-alerting.result }}
        run: test "$RESULT" = "success"
