name: RC13 Canonical Connector Commit Visibility Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-connector-commit-visibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Validate canonical connector commit and console visibility contracts
        run: |
          pytest -q \
            backend/tests/test_rc13_connector_commit_visibility.py \
            backend/tests/test_connector_ingestion_pipeline.py \
            backend/tests/test_rc13_1_source_to_intelligence.py \
            backend/tests/test_rc10_10_graphical_dashboards.py

      - name: Record exact-head evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "workflow": "RC13 Canonical Connector Commit Visibility Gate",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "claim_boundary": (
                  "Repository gate proving connector success waits for canonical DB commit and "
                  "the canonical console/dashboard read contracts remain covered. It does not "
                  "substitute for accountable owner functional acceptance."
              ),
          }
          Path("evidence/rc13-canonical-connector-commit-visibility.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rc13-canonical-connector-commit-visibility-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/rc13-canonical-connector-commit-visibility.json
