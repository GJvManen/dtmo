name: Governed Documentation Screenshot Promotion

on:
  push:
    branches:
      - docs/promote-remaining-runtime-screenshots
    paths:
      - .github/workflows/docs-promote-reviewed-screenshots.yml

permissions:
  contents: write

jobs:
  promote-reviewed-captures:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download exact reviewed screenshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9247117828'
          EXPECTED_ARTIFACT_DIGEST: 'e423efe5e1309993b267247aecbc0cec88bce9d8a4f84e0e1d60cc8e79f2f51a'
        run: |
          set -euo pipefail
          mkdir -p /tmp/dtmo-doc-shots
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/dtmo-doc-shots/screenshots.zip
          echo "${EXPECTED_ARTIFACT_DIGEST}  /tmp/dtmo-doc-shots/screenshots.zip" | sha256sum --check -
          unzip -q /tmp/dtmo-doc-shots/screenshots.zip -d /tmp/dtmo-doc-shots/extracted

      - name: Promote only reviewed product screenshots
        run: |
          set -euo pipefail
          src=/tmp/dtmo-doc-shots/extracted/generated
          dst=docs/visual/screenshots
          mkdir -p "$dst"
          for image in \
            overview-dashboard.png \
            intelligence-workspace.png \
            sources-catalogue.png \
            vulnerability-analytics.png \
            visual-analytics.png \
            governance-frameworks.png \
            administration-rbac.png
          do
            test -s "$src/$image"
            cp "$src/$image" "$dst/$image"
          done

      - name: Verify promoted PNG signatures
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          expected = (
              'overview-dashboard.png',
              'intelligence-workspace.png',
              'sources-catalogue.png',
              'vulnerability-analytics.png',
              'visual-analytics.png',
              'governance-frameworks.png',
              'administration-rbac.png',
          )
          root = Path('docs/visual/screenshots')
          signature = b'\x89PNG\r\n\x1a\n'
          for name in expected:
              path = root / name
              data = path.read_bytes()
              assert data.startswith(signature), name
              assert len(data) > 10_000, name
          PY

      - name: Commit governed screenshot binaries
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/visual/screenshots/*.png
          if git diff --cached --quiet; then
            echo 'Reviewed screenshots are already present; no commit required.'
            exit 0
          fi
          git commit -m 'docs: promote remaining reviewed runtime screenshots'
          git push origin "HEAD:${GITHUB_REF_NAME}"
