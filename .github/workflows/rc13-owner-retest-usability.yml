name: RC13 Owner Retest Usability Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usability-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Validate owner-retest usability contract
        run: |
          mkdir -p artifacts
          python -m pytest -q backend/tests/test_rc13_owner_retest_usability_contract.py \
            --junitxml=artifacts/rc13-owner-usability-contract.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc13-owner-usability-contract-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  chrome-browser:
    runs-on: ubuntu-24.04
    env:
      DTMO_ENVIRONMENT: development
      DTMO_E2E_BASE_URL: http://127.0.0.1:8765
      DTMO_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Verify Google Chrome channel
        run: google-chrome --version
      - name: Start canonical console target
        run: |
          mkdir -p artifacts
          python -m uvicorn dtmo.main:app --host 127.0.0.1 --port 8765 > artifacts/rc13-owner-console-server.log 2>&1 &
          echo $! > artifacts/rc13-owner-console-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/rc13-owner-health.json; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/rc13-owner-console-server.log
          exit 1
      - name: Execute owner-reported Chrome interaction journey
        run: |
          google-chrome --version > artifacts/google-chrome-version.txt
          python -m pytest -q backend/tests/test_rc13_owner_retest_chrome_e2e.py \
            --junitxml=artifacts/rc13-owner-chrome-e2e.xml
      - name: Record exact-head owner-retest evidence
        if: success()
        env:
          GITHUB_SHA_VALUE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          evidence = {
              "decision": "pass",
              "exact_head": os.environ["GITHUB_SHA_VALUE"],
              "browser_channel": "google-chrome",
              "owner_reported_refresh_all_covered": True,
              "empty_data_truthfulness_covered": True,
              "navigation_buttons_covered": True,
              "non_mutating_controls_covered": True,
              "browser_console_errors_required": 0,
              "browser_page_errors_required": 0,
              "menu_version_badge_absent": True,
              "administration_usability_surface_covered": True,
              "zero_dataset_graph_empty_state_covered": True,
              "synthetic_api_fixtures_only": True,
              "project_owner_functional_retest_required_after_merge": True,
              "phase8_status": "PAUSED_PENDING_RC13_REPAIR_AND_OWNER_RETEST",
          }
          Path("artifacts/rc13-owner-usability-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Stop browser target
        if: always()
        run: |
          if test -f artifacts/rc13-owner-console-server.pid; then
            kill "$(cat artifacts/rc13-owner-console-server.pid)" || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc13-owner-chrome-usability-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  owner-usability-gate:
    if: always()
    needs: [usability-contract, chrome-browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing owner-retest evidence
        env:
          CONTRACT_RESULT: ${{ needs.usability-contract.result }}
          CHROME_RESULT: ${{ needs.chrome-browser.result }}
        run: |
          test "$CONTRACT_RESULT" = "success"
          test "$CHROME_RESULT" = "success"
