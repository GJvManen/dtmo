name: Canonical Visual Analytics Recovery Gate

on:
  pull_request:
    paths:
      - "frontend/src/App.tsx"
      - "frontend/src/VisualAnalyticsWorkspace.tsx"
      - "backend/tests/test_canonical_visual_analytics_recovery_contract.py"
      - "docs/qa/PHASE11_10Q_FUNCTIONAL_COMPLETENESS_AUDIT.md"
      - "docs/development/runs/RUN-20260827-373.md"
      - ".github/workflows/canonical-visual-analytics.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify canonical Visual Analytics recovery contract
        run: python -m pytest -q backend/tests/test_canonical_visual_analytics_recovery_contract.py
