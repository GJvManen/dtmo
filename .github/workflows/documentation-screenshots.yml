name: Documentation Screenshot Artifact Gate

on:
  pull_request:
    paths:
      - "docs/visual/**"
      - "docs/product/**"
      - "docs/user/**"
      - "docs/administration/**"
      - "docs/architecture/SYSTEM_WORKFLOWS.md"
      - "tools/capture_documentation_screenshots.py"
      - "tools/capture_documentation_investigation_screenshots.py"
      - "tools/capture_canonical_workbench_screenshots.py"
      - "tools/capture_canonical_threat_intelligence_screenshot.py"
      - "tools/capture_canonical_sources_collection_screenshot.py"
      - "tools/capture_canonical_vulnerability_exposure_screenshot.py"
      - ".github/workflows/documentation-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-documentation-screenshots:
    runs-on: ubuntu-24.04
    env:
      DTMO_ENVIRONMENT: development
      DTMO_DATABASE_URL: postgresql+psycopg://dtmo:dtmo@127.0.0.1:5432/dtmo
      DTMO_REDIS_URL: redis://127.0.0.1:6379/0
      DTMO_OPENSEARCH_URL: http://127.0.0.1:9200
      DTMO_MINIO_ENDPOINT: 127.0.0.1:9000
      DTMO_FEATURE_LIVE_CONNECTORS: "false"
      DTMO_E2E_BASE_URL: http://127.0.0.1:8765
      DTMO_FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build canonical workbench
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install DTMO test dependencies
        run: python -m pip install -e '.[test]'
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Start bounded canonical DTMO documentation target
        run: |
          mkdir -p artifacts/documentation-screenshots
          python -m uvicorn dtmo.main:app --host 127.0.0.1 --port 8765 > artifacts/documentation-screenshots/canonical-server.log 2>&1 &
          echo $! > artifacts/documentation-screenshots/canonical-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/documentation-screenshots/canonical-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/health > /dev/null || {
            cat artifacts/documentation-screenshots/canonical-server.log
            exit 1
          }
      - name: Start bounded legacy DTMO documentation target
        env:
          DTMO_FRONTEND_DIST: ${{ github.workspace }}/artifacts/no-frontend-dist
        run: |
          python -m uvicorn dtmo.main:app --host 127.0.0.1 --port 8766 > artifacts/documentation-screenshots/legacy-server.log 2>&1 &
          echo $! > artifacts/documentation-screenshots/legacy-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/health > artifacts/documentation-screenshots/legacy-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8766/health > /dev/null || {
            cat artifacts/documentation-screenshots/legacy-server.log
            exit 1
          }
      - name: Capture deterministic legacy product documentation screenshots
        run: |
          python tools/capture_documentation_screenshots.py \
            --base-url http://127.0.0.1:8766 \
            --output artifacts/documentation-screenshots/generated
      - name: Capture deterministic investigation documentation screenshots
        run: |
          python tools/capture_documentation_investigation_screenshots.py \
            --base-url http://127.0.0.1:8766 \
            --output artifacts/documentation-screenshots/generated
      - name: Capture canonical Command Center candidate
        run: |
          python tools/capture_canonical_workbench_screenshots.py \
            --base-url http://127.0.0.1:8765 \
            --output artifacts/documentation-screenshots/generated
      - name: Capture canonical Threat Intelligence candidate
        run: |
          python tools/capture_canonical_threat_intelligence_screenshot.py \
            --base-url http://127.0.0.1:8765 \
            --output artifacts/documentation-screenshots/generated
      - name: Capture canonical Sources and Collection candidate
        run: |
          python tools/capture_canonical_sources_collection_screenshot.py \
            --base-url http://127.0.0.1:8765 \
            --output artifacts/documentation-screenshots/generated
      - name: Capture canonical Vulnerability and Exposure candidate
        run: |
          python tools/capture_canonical_vulnerability_exposure_screenshot.py \
            --base-url http://127.0.0.1:8765 \
            --output artifacts/documentation-screenshots/generated
      - name: Validate screenshot artifact contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/documentation-screenshots/generated")
          required = {
              "overview-dashboard.png", "intelligence-workspace.png", "sources-catalogue.png",
              "vulnerability-analytics.png", "misp-governed-workflow.png", "ail-correlation-workspace.png",
              "audit-correlation.png", "visual-analytics.png", "governance-frameworks.png",
              "administration-rbac.png", "command-center-workbench.png", "threat-intelligence-workbench.png",
              "sources-collection-workbench.png", "vulnerability-exposure-workbench.png",
          }
          present = {path.name for path in root.glob("*.png")}
          missing = sorted(required - present)
          if missing:
              raise SystemExit(f"missing screenshot artifacts: {missing}")
          for filename in sorted(required):
              size = (root / filename).stat().st_size
              if size < 10_000:
                  raise SystemExit(f"screenshot artifact unexpectedly small: {filename} ({size} bytes)")

          base_metadata = json.loads((root / "capture-metadata.json").read_text(encoding="utf-8"))
          investigation_metadata = json.loads((root / "investigation-capture-metadata.json").read_text(encoding="utf-8"))
          canonical_metadata = json.loads((root / "canonical-capture-metadata.json").read_text(encoding="utf-8"))
          threat_metadata = json.loads((root / "canonical-threat-intelligence-capture-metadata.json").read_text(encoding="utf-8"))
          collection_metadata = json.loads((root / "canonical-sources-collection-capture-metadata.json").read_text(encoding="utf-8"))
          exposure_metadata = json.loads((root / "canonical-vulnerability-exposure-capture-metadata.json").read_text(encoding="utf-8"))
          for metadata in (base_metadata, investigation_metadata, canonical_metadata, threat_metadata, collection_metadata, exposure_metadata):
              if metadata.get("capture_mode") != "actual-runtime-ui-with-synthetic-fixture-data":
                  raise SystemExit("unexpected screenshot capture mode")
              if metadata.get("evidence_classification") != "documentation-illustration-only":
                  raise SystemExit("unexpected screenshot evidence classification")
          if investigation_metadata.get("raw_content_exposed") is not False:
              raise SystemExit("AIL documentation capture must not expose raw content")
          if investigation_metadata.get("audit_read_only") is not True:
              raise SystemExit("audit documentation capture must remain read-only")
          if investigation_metadata.get("misp_export_executed") is not False:
              raise SystemExit("MISP documentation capture must not execute outbound export")
          if investigation_metadata.get("misp_live_connectivity_proven") is not False:
              raise SystemExit("fixture-backed MISP capture must not claim live connectivity")
          if canonical_metadata.get("canonical_route") != "/workbench/command-center":
              raise SystemExit("canonical Command Center capture must use /workbench/command-center")
          if threat_metadata.get("canonical_route") != "/workbench/intelligence":
              raise SystemExit("canonical Threat Intelligence capture must use /workbench/intelligence")
          if threat_metadata.get("journey") != "recent canonical intelligence -> object detail -> provenance chain":
              raise SystemExit("canonical Threat Intelligence capture must prove the bounded detail/provenance journey")
          if collection_metadata.get("canonical_route") != "/workbench/collection":
              raise SystemExit("canonical Sources & Collection capture must use /workbench/collection")
          if collection_metadata.get("journey") != "source catalog -> built-in readiness -> provenance boundary":
              raise SystemExit("canonical Sources & Collection capture must prove the bounded readiness/provenance journey")
          if exposure_metadata.get("canonical_route") != "/workbench/exposure":
              raise SystemExit("canonical Vulnerability & Exposure capture must use /workbench/exposure")
          if exposure_metadata.get("journey") != "vulnerability evidence -> prioritization attributes -> provenance boundary":
              raise SystemExit("canonical Vulnerability & Exposure capture must prove the bounded prioritization/provenance journey")
          for metadata in (canonical_metadata, threat_metadata, collection_metadata, exposure_metadata):
              for claim in ("live_connectivity_proven", "owner_acceptance_proven", "production_equivalent_proven"):
                  if metadata.get(claim) is not False:
                      raise SystemExit(f"canonical fixture capture must not assert {claim}")
          for claim in ("review_authority_proven", "share_authority_proven"):
              if threat_metadata.get(claim) is not False:
                  raise SystemExit(f"Threat Intelligence documentation capture must not assert {claim}")
          for claim in ("connector_execution_proven", "source_activation_authority_proven", "publication_authority_proven"):
              if collection_metadata.get(claim) is not False:
                  raise SystemExit(f"Sources & Collection documentation capture must not assert {claim}")
          if collection_metadata.get("credential_value_exposed") is not False:
              raise SystemExit("Sources & Collection documentation capture must not expose credential values")
          for claim in ("local_exposure_proven", "exploitability_proven", "compromise_proven", "remediation_proven", "scanner_authority_proven", "publication_authority_proven", "share_authority_proven"):
              if exposure_metadata.get(claim) is not False:
                  raise SystemExit(f"Vulnerability & Exposure documentation capture must not assert {claim}")
          print("PASS: documentation screenshot artifacts are complete and correctly classified")
          PY
      - name: Stop documentation targets
        if: always()
        run: |
          for pidfile in artifacts/documentation-screenshots/canonical-server.pid artifacts/documentation-screenshots/legacy-server.pid; do
            if test -f "$pidfile"; then
              kill "$(cat "$pidfile")" || true
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dtmo-documentation-screenshots
          path: artifacts/documentation-screenshots/
          retention-days: 30
          if-no-files-found: error

  documentation-screenshot-gate:
    if: always()
    needs: [capture-documentation-screenshots]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed screenshot artifacts
        env:
          CAPTURE_RESULT: ${{ needs.capture-documentation-screenshots.result }}
        run: test "$CAPTURE_RESULT" = "success"
