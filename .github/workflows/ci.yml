name: RC4 Quality Gate

# Execution probe 2026-08-06T10:06+02:00
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  workflow-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -e '.[test]'
      - name: Validate workflow contract
        run: |
          mkdir -p artifacts
          pytest backend/tests/test_ci_workflow_contract.py --junitxml=artifacts/workflow-contracts.xml
      - name: Create identity-bound evidence manifest
        if: always()
        env:
          EVIDENCE_CONCLUSION: ${{ job.status }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema_version": 1,
              "workflow": "RC4 Quality Gate",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "head_sha": os.environ["GITHUB_SHA"].lower(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "conclusion": os.environ["EVIDENCE_CONCLUSION"],
              "run_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
          }
          Path("artifacts/workflow-contract-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat artifacts/workflow-contract-evidence.json
      - name: Upload workflow contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-contract-evidence
          path: |
            artifacts/workflow-contracts.xml
            artifacts/workflow-contract-evidence.json
          if-no-files-found: error
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[test]'
      - name: Lint
        run: ruff check backend database
      - name: Type check
        run: mypy backend/dtmo
      - name: Tests
        run: pytest --cov=dtmo --cov-report=term-missing --cov-fail-under=80
      - name: Compile
        run: python -m compileall -q backend database

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dtmo
          POSTGRES_USER: dtmo
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtmo -d dtmo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DTMO_ENVIRONMENT: test
      DTMO_DATABASE_URL: postgresql+psycopg://dtmo:change-me@127.0.0.1:5432/dtmo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[test]'
      - name: Upgrade schema
        run: alembic upgrade head
      - name: Validate current revision
        run: alembic current
      - name: Downgrade and re-upgrade
        run: |
          alembic downgrade base
          alembic upgrade head

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dtmo:rc4 .
      - name: Run image smoke test
        run: |
          docker run -d --name dtmo -p 8000:8000 --env DTMO_ENVIRONMENT=test dtmo:rc4
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 2; done
          docker logs dtmo
          exit 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  release-gate:
    if: always()
    needs:
      - workflow-contracts
      - test
      - migrations
      - container
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate all release-critical jobs
        env:
          WORKFLOW_CONTRACTS: ${{ needs.workflow-contracts.result }}
          TESTS: ${{ needs.test.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          CONTAINER: ${{ needs.container.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          results = {
              "workflow-contracts": os.environ["WORKFLOW_CONTRACTS"],
              "test": os.environ["TESTS"],
              "migrations": os.environ["MIGRATIONS"],
              "container": os.environ["CONTAINER"],
              "dependency-review": os.environ["DEPENDENCY_REVIEW"],
          }
          required = {"workflow-contracts", "test", "migrations", "container"}
          failures = [name for name in required if results[name] != "success"]
          dependency_result = results["dependency-review"]
          if dependency_result not in {"success", "skipped"}:
              failures.append("dependency-review")

          evidence = {
              "schema_version": 1,
              "workflow": "RC4 Quality Gate",
              "gate": "release-gate",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "head_sha": os.environ["GITHUB_SHA"].lower(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "job_results": results,
              "decision": "pass" if not failures else "blocked",
              "blocking_jobs": failures,
              "run_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
          }
          Path("artifacts/release-gate-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          if failures:
              raise SystemExit(f"Release blocked by: {', '.join(failures)}")
          PY
      - name: Publish release gate summary
        if: always()
        run: |
          {
            echo "## RC4 aggregate release gate"
            echo "- Workflow contracts: ${{ needs.workflow-contracts.result }}"
            echo "- Tests: ${{ needs.test.result }}"
            echo "- Migrations: ${{ needs.migrations.result }}"
            echo "- Container: ${{ needs.container.result }}"
            echo "- Dependency review: ${{ needs.dependency-review.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload aggregate release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: artifacts/release-gate-evidence.json
          if-no-files-found: error
          retention-days: 30
