name: RC4 Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  workflow-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -e '.[test]'
      - name: Validate workflow contract
        run: |
          mkdir -p artifacts
          pytest backend/tests/test_ci_workflow_contract.py --junitxml=artifacts/workflow-contracts.xml
      - name: Create identity-bound evidence manifest
        if: always()
        env:
          EVIDENCE_CONCLUSION: ${{ job.status }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema_version": 1,
              "workflow": "RC4 Quality Gate",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "head_sha": os.environ["GITHUB_SHA"].lower(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "conclusion": os.environ["EVIDENCE_CONCLUSION"],
              "run_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
          }
          Path("artifacts/workflow-contract-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat artifacts/workflow-contract-evidence.json
      - name: Upload workflow contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-contract-evidence
          path: |
            artifacts/workflow-contracts.xml
            artifacts/workflow-contract-evidence.json
          if-no-files-found: error
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[test]'
      - name: Lint
        run: ruff check backend database
      - name: Type check
        run: mypy backend/dtmo
      - name: Tests
        run: pytest --cov=dtmo --cov-report=term-missing --cov-fail-under=80
      - name: Compile
        run: python -m compileall -q backend database

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dtmo
          POSTGRES_USER: dtmo
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtmo -d dtmo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DTMO_ENVIRONMENT: test
      DTMO_DATABASE_URL: postgresql+psycopg://dtmo:change-me@127.0.0.1:5432/dtmo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[test]'
      - name: Upgrade schema
        run: alembic upgrade head
      - name: Validate current revision
        run: alembic current
      - name: Downgrade and re-upgrade
        run: |
          alembic downgrade base
          alembic upgrade head

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dtmo:rc4 .
      - name: Run image smoke test
        run: |
          docker run -d --name dtmo -p 8000:8000 --env DTMO_ENVIRONMENT=test dtmo:rc4
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 2; done
          docker logs dtmo
          exit 1

  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tooling and project
        run: pip install -e '.[test]'
      - name: Audit resolved Python dependencies
        run: |
          mkdir -p artifacts
          pip-audit --format=json --output=artifacts/pip-audit.json
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-evidence
          path: artifacts/pip-audit.json
          if-no-files-found: error
          retention-days: 30
