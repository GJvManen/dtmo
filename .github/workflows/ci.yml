name: RC4 Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  workflow-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare evidence directory
        run: mkdir -p artifacts
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate workflow contract
        run: python -m pytest backend/tests/test_ci_workflow_contract.py --junitxml=artifacts/workflow-contracts.xml
      - name: Create identity-bound evidence manifest
        if: always()
        env:
          EVIDENCE_CONCLUSION: ${{ job.status }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              "schema_version": 1,
              "workflow": "RC4 Quality Gate",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "head_sha": os.environ["GITHUB_SHA"].lower(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "conclusion": os.environ["EVIDENCE_CONCLUSION"],
              "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          Path("artifacts/workflow-contract-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload workflow contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-contract-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Environment diagnostics
        run: |
          python --version
          python -m pip --version
          python -m pip check
      - name: Lint
        run: python -m ruff check backend database
      - name: Type check
        run: python -m mypy backend/dtmo
      - name: Tests
        run: python -m pytest --cov=dtmo --cov-report=term-missing --cov-fail-under=80
      - name: Compile
        run: python -m compileall -q backend database

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dtmo
          POSTGRES_USER: dtmo
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtmo -d dtmo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DTMO_ENVIRONMENT: test
      DTMO_DATABASE_URL: postgresql+psycopg://dtmo:change-me@127.0.0.1:5432/dtmo
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Migration diagnostics
        run: |
          python --version
          python -m pip check
          test -f alembic.ini
          test -f database/migrations/env.py
      - name: Upgrade schema
        run: python -m alembic upgrade head
      - name: Validate current revision
        run: python -m alembic current
      - name: Downgrade and re-upgrade
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build --progress=plain -t dtmo:rc4 .
      - name: Run image smoke test
        run: |
          set -euo pipefail
          docker run -d --name dtmo -p 8000:8000 --env DTMO_ENVIRONMENT=test dtmo:rc4
          trap 'docker logs dtmo || true; docker rm -f dtmo || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tooling and project dependencies
        run: python -m pip install -e '.[test]'
      - name: Audit resolved Python dependencies
        run: |
          set -uo pipefail
          mkdir -p artifacts
          AUDIT_EXIT_CODE=0
          python -m pip_audit --format json --output artifacts/pip-audit.json || AUDIT_EXIT_CODE=$?
          test -s artifacts/pip-audit.json
          echo "## pip-audit JSON evidence"
          python -m json.tool artifacts/pip-audit.json
          echo "## pip-audit human-readable findings"
          python -m pip_audit || true
          if [ "$AUDIT_EXIT_CODE" -ne 0 ]; then
            echo "Dependency audit found one or more known vulnerabilities."
            exit "$AUDIT_EXIT_CODE"
          fi
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-evidence
          path: artifacts/pip-audit.json
          if-no-files-found: error
          retention-days: 30

  release-gate:
    if: always()
    needs: [workflow-contracts, test, migrations, container, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate all release-critical jobs
        env:
          WORKFLOW_CONTRACTS: ${{ needs.workflow-contracts.result }}
          TESTS: ${{ needs.test.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          CONTAINER: ${{ needs.container.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          results = {
              "workflow-contracts": os.environ["WORKFLOW_CONTRACTS"],
              "test": os.environ["TESTS"],
              "migrations": os.environ["MIGRATIONS"],
              "container": os.environ["CONTAINER"],
              "dependency-review": os.environ["DEPENDENCY_REVIEW"],
          }
          required = set(results)
          failures = [name for name in required if results[name] != "success"]
          evidence = {
              "schema_version": 1,
              "workflow": "RC4 Quality Gate",
              "gate": "release-gate",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "head_sha": os.environ["GITHUB_SHA"].lower(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "job_results": results,
              "decision": "pass" if not failures else "blocked",
              "blocking_jobs": failures,
              "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          Path("artifacts/release-gate-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          if failures:
              raise SystemExit(f"Release blocked by: {', '.join(failures)}")
          PY
      - name: Publish release gate summary
        if: always()
        run: |
          {
            echo "## RC4 aggregate release gate"
            echo "- Workflow contracts: ${{ needs.workflow-contracts.result }}"
            echo "- Tests: ${{ needs.test.result }}"
            echo "- Migrations: ${{ needs.migrations.result }}"
            echo "- Container: ${{ needs.container.result }}"
            echo "- Dependency review: ${{ needs.dependency-review.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload aggregate release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-evidence
          path: artifacts/release-gate-evidence.json
          if-no-files-found: error
          retention-days: 30
