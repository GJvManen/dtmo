name: RC13 Local Object-store Credential Contract Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-objectstore-credential-contract:
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AISTOR_IMAGE: quay.io/minio/aistor/minio:RELEASE.ci-placeholder@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AISTOR_LICENSE_FILE: /tmp/aistor-ci.license
      MINIO_ROOT_USER: dtmo-ci-local-admin
      MINIO_ROOT_PASSWORD: dtmo-ci-local-secret-not-for-production
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: dtmo-ci-opensearch-secret-not-for-production
      GRAFANA_ADMIN_USER: dtmo-ci-grafana-admin
      GRAFANA_ADMIN_PASSWORD: dtmo-ci-grafana-secret-not-for-production
      GRAFANA_DB_PASSWORD: dtmo-ci-grafana-reader-secret-not-for-production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Validate object-store source contracts
        run: python -m pytest backend/tests/test_supported_object_storage_migration.py -q

      - name: Render local Compose configuration
        run: |
          set -euo pipefail
          cp .env.example .env
          : > /tmp/aistor-ci.license
          docker compose config --format json > /tmp/dtmo-compose.json

      - name: Require rendered API and AIStor credentials to match locally
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path('/tmp/dtmo-compose.json').read_text())
          services = config['services']
          api_env = services['api']['environment']
          minio_env = services['minio']['environment']

          expected_user = os.environ['MINIO_ROOT_USER']
          expected_password = os.environ['MINIO_ROOT_PASSWORD']

          assert minio_env['MINIO_ROOT_USER'] == expected_user, minio_env
          assert minio_env['MINIO_ROOT_PASSWORD'] == expected_password, minio_env
          assert api_env['DTMO_MINIO_ACCESS_KEY'] == expected_user, api_env
          assert api_env['DTMO_MINIO_SECRET_KEY'] == expected_password, api_env
          assert api_env['DTMO_MINIO_ACCESS_KEY'] != 'dtmo', api_env
          assert api_env['DTMO_MINIO_SECRET_KEY'] != 'change-me-now', api_env
          PY

      - name: Record exact-head evidence
        if: always()
        env:
          GATE_CONCLUSION: ${{ job.status }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "schema_version": 1,
              "workflow": "RC13 Local Object-store Credential Contract Gate",
              "gate": "local-objectstore-credential-contract",
              "head_sha": os.environ["EXPECTED_HEAD_SHA"].lower(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "conclusion": os.environ["GATE_CONCLUSION"],
              "checks": [
                  "exact PR-head checkout",
                  "supported object-storage source contracts",
                  "rendered local Compose configuration",
                  "local API object-store identity equals local AIStor bootstrap identity",
                  "staging least-privilege object-store identity remains distinct",
              ],
          }
          Path("artifacts/rc13-local-objectstore-credential-contract.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rc13-local-objectstore-credential-contract-evidence
          path: artifacts/rc13-local-objectstore-credential-contract.json
          if-no-files-found: error
          retention-days: 30
