name: Phase 11.10q Automation Observability Recovery Gate

on:
  pull_request:
    paths:
      - 'frontend/src/AutomationWorkspace.tsx'
      - 'docs/user/AUTOMATION_PLAYBOOKS_WORKSPACE.md'
      - 'backend/tests/test_phase11_10q_automation_observability.py'
      - '.github/workflows/phase11-10q-automation-observability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automation-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify executable and observable automation recovery
        run: python -m pytest -q backend/tests/test_phase11_10q_automation_observability.py backend/tests/test_phase11_10k_automation_playbooks_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build canonical workbench
        working-directory: frontend
        run: npm ci && npm run build
