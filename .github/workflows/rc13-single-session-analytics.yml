name: RC13 Single-session Visual Analytics Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-session-analytics:
    runs-on: ubuntu-24.04
    env:
      DTMO_ENVIRONMENT: development
      DTMO_E2E_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Execute RC13.2 static security contract
        run: |
          mkdir -p artifacts
          python -m pytest -q backend/tests/test_rc13_2_single_session_analytics.py \
            --junitxml=artifacts/rc13-single-session-static.xml
      - name: Start bounded DTMO analytics browser target
        run: |
          python -m uvicorn dtmo.main:app --host 127.0.0.1 --port 8765 > artifacts/rc13-analytics-server.log 2>&1 &
          echo $! > artifacts/rc13-analytics-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/health.json; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/rc13-analytics-server.log
          exit 1
      - name: Execute RC13.2 single-session analytics journey
        run: |
          python -m pytest -q backend/tests/test_rc13_2_visual_analytics_browser_e2e.py \
            --junitxml=artifacts/rc13-single-session-browser.xml
      - name: Record machine-readable RC13.2 evidence
        if: success()
        env:
          GITHUB_SHA_VALUE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "decision": "pass",
              "exact_head": os.environ["GITHUB_SHA_VALUE"],
              "journey": "canonical_visual_analytics_without_second_login",
              "browser": "chromium",
              "native_severity_visible": True,
              "native_source_distribution_visible": True,
              "native_connector_health_visible": True,
              "native_review_status_visible": True,
              "grafana_shell_user_visible": False,
              "grafana_request_during_normal_analytics": False,
              "grafana_anonymous_access_enabled": False,
              "publication_authority_changed": False,
              "synthetic_browser_fixtures_only": True,
          }
          Path("artifacts/rc13-single-session-analytics-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Stop browser target
        if: always()
        run: |
          if test -f artifacts/rc13-analytics-server.pid; then
            kill "$(cat artifacts/rc13-analytics-server.pid)" || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc13-single-session-analytics-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  single-session-analytics-gate:
    if: always()
    needs: [single-session-analytics]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing or failed RC13.2 evidence
        env:
          ANALYTICS_RESULT: ${{ needs.single-session-analytics.result }}
        run: test "$ANALYTICS_RESULT" = "success"
