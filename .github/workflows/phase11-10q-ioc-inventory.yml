name: Phase 11.10q IOC Inventory Gate

on:
  pull_request:
    paths:
      - 'backend/dtmo/intelowl_execution.py'
      - 'backend/tests/test_phase11_10q_ioc_inventory_contract.py'
      - 'backend/tests/test_phase11_10d_unified_intelligence_workspace_browser.py'
      - 'frontend/src/IocExplorerWorkspace.tsx'
      - 'frontend/src/UnifiedIntelligenceWorkspace.tsx'
      - 'docs/architecture/PHASE11_10Q_IOC_EXPLORER_RECOVERY.md'
      - '.github/workflows/phase11-10q-ioc-inventory.yml'

permissions:
  contents: read

jobs:
  ioc-inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run IOC inventory repository contracts
        run: python -m pytest -q backend/tests/test_phase11_10q_ioc_inventory_contract.py

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact frontend dependency graph
        working-directory: frontend
        run: npm ci

      - name: Build canonical workbench
        working-directory: frontend
        run: npm run build
