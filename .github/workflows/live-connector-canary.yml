name: RC7 Live Connector Canary Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-connector-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Run governed CISA KEV canary
        run: |
          set -euo pipefail
          python tools/run_live_connector_canary.py \
            --timeout-seconds 15 \
            --max-attempts 3 \
            --minimum-interval-seconds 2 \
            --maximum-records 2000 \
            --output artifacts/live-connector-canary-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('artifacts/live-connector-canary-evidence.json').read_text())
          assert evidence['status'] == 'completed'
          assert evidence['record_count'] > 0
          assert evidence['publish_approved'] is False
          assert evidence['licence']
          assert evidence['terms_url'].startswith('https://')
          assert all(record['source_url'].startswith('https://') for record in evidence['records'])
          assert all(record['evidence_hash'] for record in evidence['records'])
          PY
      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-connector-canary-evidence
          path: artifacts/live-connector-canary-evidence.json
          if-no-files-found: error
          retention-days: 30

  connector-canary-gate:
    if: always()
    needs: [live-connector-canary]
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on missing or failed canary evidence
        env:
          CANARY_RESULT: ${{ needs.live-connector-canary.result }}
        run: test "$CANARY_RESULT" = "success"
