name: Post-RC13 Severity UX Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  severity-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Validate shared severity contracts
        run: |
          mkdir -p artifacts
          python -m pytest -q \
            backend/tests/test_post_rc13_severity_ux.py \
            backend/tests/test_rc10_10_graphical_dashboards.py \
            backend/tests/test_rc10_unified_console.py \
            backend/tests/test_rc13_owner_retest_usability_contract.py \
            --junitxml=artifacts/post-rc13-severity-contract.xml

      - name: Record exact-head contract evidence
        if: always()
        env:
          GITHUB_SHA_VALUE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          evidence = {
              "workflow": "Post-RC13 Severity UX Gate",
              "evidence_class": "contract",
              "exact_head": os.environ["GITHUB_SHA_VALUE"],
              "canonical_severities": ["informational", "low", "medium", "high", "critical"],
              "overview_and_intelligence_share_filter": True,
              "dashboard_intelligence_aggregates_share_postgres_predicate": True,
              "connector_health_filter_scope": "operational-unfiltered",
              "search_reuses_existing_governed_severity_parameter": True,
              "critical_remains_distinct": True,
              "framework_mapping_inference": False,
              "publication_authority_changed": False,
              "phase8_credit": False,
              "repository_evidence_only": True,
          }
          Path("artifacts/post-rc13-severity-contract.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-rc13-severity-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  severity-chrome:
    runs-on: ubuntu-24.04
    env:
      DTMO_ENVIRONMENT: development
      DTMO_E2E_BASE_URL: http://127.0.0.1:8765
      DTMO_BROWSER_CHANNEL: chrome
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Verify Google Chrome channel
        run: google-chrome --version

      - name: Start canonical console target
        run: |
          mkdir -p artifacts
          python -m uvicorn dtmo.main:app --host 127.0.0.1 --port 8765 > artifacts/post-rc13-severity-server.log 2>&1 &
          echo $! > artifacts/post-rc13-severity-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/post-rc13-severity-health.json; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/post-rc13-severity-server.log
          exit 1

      - name: Execute shared severity Chrome journey
        run: |
          google-chrome --version > artifacts/google-chrome-version.txt
          python -m pytest -q backend/tests/test_post_rc13_severity_browser_e2e.py \
            --junitxml=artifacts/post-rc13-severity-chrome.xml

      - name: Record exact-head browser evidence
        if: success()
        env:
          GITHUB_SHA_VALUE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          evidence = {
              "workflow": "Post-RC13 Severity UX Gate",
              "evidence_class": "google-chrome-browser",
              "exact_head": os.environ["GITHUB_SHA_VALUE"],
              "browser_channel": "google-chrome",
              "shared_overview_intelligence_filter": True,
              "existing_search_composition": True,
              "filter_aware_empty_states": True,
              "severity_visible_labels_and_non_colour_cues": True,
              "critical_distinct": True,
              "browser_console_errors_required": 0,
              "browser_page_errors_required": 0,
              "synthetic_api_fixtures_only": True,
              "phase8_credit": False,
              "publication_authority_changed": False,
          }
          Path("artifacts/post-rc13-severity-browser.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Stop browser target
        if: always()
        run: |
          if test -f artifacts/post-rc13-severity-server.pid; then
            kill "$(cat artifacts/post-rc13-severity-server.pid)" || true
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-rc13-severity-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  severity-gate:
    if: always()
    needs: [severity-contract, severity-chrome]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on missing severity evidence
        env:
          CONTRACT_RESULT: ${{ needs.severity-contract.result }}
          CHROME_RESULT: ${{ needs.severity-chrome.result }}
        run: |
          test "$CONTRACT_RESULT" = "success"
          test "$CHROME_RESULT" = "success"
