name: Phase 11.10q Same-origin Browser Acceptance Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/dtmo/**'
      - 'backend/tests/test_phase11_10q_same_origin_browser_acceptance.py'
      - 'backend/tests/test_phase11_10q_whole_product_retest_readiness.py'
      - 'backend/tests/test_owner_functional_recovery_browser_matrix.py'
      - 'backend/tests/test_owner_functional_recovery_threat_intelligence.py'
      - 'backend/tests/test_owner_functional_recovery_ioc_explorer.py'
      - 'backend/tests/test_owner_functional_recovery_knowledge_graph.py'
      - 'backend/tests/test_owner_functional_recovery_exposure.py'
      - 'backend/tests/test_owner_functional_recovery_investigations.py'
      - 'backend/tests/test_owner_functional_recovery_analysis.py'
      - 'backend/tests/test_owner_functional_recovery_governance.py'
      - 'backend/tests/test_owner_functional_recovery_operations.py'
      - 'database/migrations/**'
      - '.github/workflows/phase11-10q-same-origin-browser-acceptance.yml'
      - 'docs/roadmap/FUNCTIONAL_RECOVERY_ACCEPTANCE.md'
      - 'docs/qa/CANONICAL_FUNCTIONAL_BROWSER_MATRIX.md'
      - 'docs/qa/WHOLE_PRODUCT_OWNER_RETEST_READINESS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-origin-browser-acceptance:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dtmo
          POSTGRES_USER: dtmo
          POSTGRES_PASSWORD: dtmo-acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtmo -d dtmo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:2.19.6
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DTMO_ENVIRONMENT: development
      DTMO_DATABASE_URL: postgresql+psycopg://dtmo:dtmo-acceptance@127.0.0.1:5432/dtmo
      DTMO_OPENSEARCH_URL: http://127.0.0.1:9200
      DTMO_MINIO_ENDPOINT: 127.0.0.1:9000
      DTMO_MINIO_ACCESS_KEY: dtmo-acceptance
      DTMO_MINIO_SECRET_KEY: dtmo-acceptance-secret-value
      DTMO_MINIO_SECURE: 'false'
      DTMO_FEATURE_LIVE_CONNECTORS: 'false'
      DTMO_FEATURE_OPENCVE_CONNECTOR: 'false'
      DTMO_FEATURE_VULNERABILITY_LOOKUP_CONNECTOR: 'false'
      DTMO_FEATURE_MISP_CONNECTOR: 'false'
      DTMO_FEATURE_MISP_EXPORT: 'false'
      DTMO_FEATURE_AIL_CONNECTOR: 'false'
      DTMO_FEATURE_TARANIS_CONNECTOR: 'false'
      DTMO_FEATURE_INTELOWL_ENRICHMENT: 'true'
      DTMO_INTELOWL_API_BASE: http://127.0.0.1:8772
      DTMO_INTELOWL_API_TOKEN: repository-controlled-intelowl-token
      DTMO_INTELOWL_ALLOWED_ANALYZERS: functional_domain
      DTMO_INTELOWL_POLL_INTERVAL_SECONDS: '0.01'
      DTMO_FEATURE_CORTEX_ANALYSIS: 'false'
      DTMO_FEATURE_OPENCTI_READ: 'false'
      DTMO_FEATURE_THEHIVE_HANDOFF: 'true'
      DTMO_THEHIVE_API_BASE: http://127.0.0.1:8771
      DTMO_THEHIVE_API_TOKEN: repository-controlled-test-token
      DTMO_THEHIVE_ORGANIZATION: functional-recovery-org
      DTMO_E2E_BASE_URL: http://127.0.0.1:8765
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build exact-head canonical workbench
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'

      - name: Create exact-head database schema
        run: alembic upgrade head

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Start repository-controlled MinIO
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name dtmo-functional-minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$DTMO_MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$DTMO_MINIO_SECRET_KEY" \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs dtmo-functional-minio
          exit 1

      - name: Start repository-controlled TheHive API emulator
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY' > artifacts/phase11-10q-thehive-emulator.log 2>&1 &
          import json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/health":
                      self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
                  self.send_response(404); self.end_headers()

              def do_POST(self):
                  if self.path != "/api/v1/case":
                      self.send_response(404); self.end_headers(); return
                  if self.headers.get("Authorization") != "Bearer repository-controlled-test-token":
                      self.send_response(403); self.end_headers(); return
                  if self.headers.get("X-Organisation") != "functional-recovery-org":
                      self.send_response(403); self.end_headers(); return
                  length = int(self.headers.get("Content-Length", "0"))
                  payload = json.loads(self.rfile.read(length) or b"{}")
                  required = {"title", "description", "severity", "tlp", "pap", "tags"}
                  if not required.issubset(payload):
                      self.send_response(422); self.end_headers(); return
                  body = json.dumps({"_id": "repo-case-4242", "number": 4242}).encode()
                  self.send_response(201); self.send_header("Content-Type", "application/json"); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)

              def log_message(self, format, *args): print(format % args, flush=True)

          ThreadingHTTPServer(("127.0.0.1", 8771), Handler).serve_forever()
          PY
          echo $! > artifacts/phase11-10q-thehive-emulator.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8771/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/phase11-10q-thehive-emulator.log
          exit 1

      - name: Start repository-controlled IntelOwl API emulator
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY' > artifacts/phase11-10q-intelowl-emulator.log 2>&1 &
          import json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          TOKEN = "Token repository-controlled-intelowl-token"
          JOB = "repo-intelowl-4242"

          class Handler(BaseHTTPRequestHandler):
              def _json(self, status, payload):
                  body = json.dumps(payload).encode()
                  self.send_response(status); self.send_header("Content-Type", "application/json"); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)

              def do_GET(self):
                  if self.path == "/health":
                      self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
                  if self.path != f"/api/jobs/{JOB}":
                      self.send_response(404); self.end_headers(); return
                  if self.headers.get("Authorization") != TOKEN:
                      self.send_response(403); self.end_headers(); return
                  self._json(200, {"id": JOB, "status": "finished", "analyzer_reports": [{"name": "functional_domain", "status": "success", "report": {"classification": "repository-controlled"}}]})

              def do_POST(self):
                  if self.path != "/api/analyze_observable":
                      self.send_response(404); self.end_headers(); return
                  if self.headers.get("Authorization") != TOKEN:
                      self.send_response(403); self.end_headers(); return
                  length = int(self.headers.get("Content-Length", "0"))
                  payload = json.loads(self.rfile.read(length) or b"{}")
                  if payload.get("observable_classification") != "domain" or payload.get("analyzers_requested") != ["functional_domain"] or payload.get("connectors_requested") != []:
                      self._json(422, {"detail": "unexpected governed request"}); return
                  self._json(201, {"job_id": JOB})

              def log_message(self, format, *args): print(format % args, flush=True)

          ThreadingHTTPServer(("127.0.0.1", 8772), Handler).serve_forever()
          PY
          echo $! > artifacts/phase11-10q-intelowl-emulator.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8772/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/phase11-10q-intelowl-emulator.log
          exit 1

      - name: Start exact-head DTMO with built workbench
        shell: bash
        run: |
          mkdir -p artifacts
          DTMO_FRONTEND_DIST="$PWD/frontend/dist" uvicorn dtmo.main:app --app-dir backend --host 127.0.0.1 --port 8765 > artifacts/phase11-10q-same-origin-server.log 2>&1 &
          echo $! > artifacts/phase11-10q-same-origin-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/phase11-10q-same-origin-health.json; then exit 0; fi
            sleep 1
          done
          cat artifacts/phase11-10q-same-origin-server.log
          exit 1

      - name: Validate whole-product retest composition
        run: python -m pytest -q backend/tests/test_phase11_10q_whole_product_retest_readiness.py

      - name: Execute unmocked same-origin browser journeys
        run: |
          python -m pytest -q \
            backend/tests/test_phase11_10q_same_origin_browser_acceptance.py \
            backend/tests/test_owner_functional_recovery_browser_matrix.py \
            backend/tests/test_owner_functional_recovery_threat_intelligence.py \
            backend/tests/test_owner_functional_recovery_ioc_explorer.py \
            backend/tests/test_owner_functional_recovery_knowledge_graph.py \
            backend/tests/test_owner_functional_recovery_exposure.py \
            backend/tests/test_owner_functional_recovery_investigations.py \
            backend/tests/test_owner_functional_recovery_analysis.py \
            backend/tests/test_owner_functional_recovery_governance.py \
            backend/tests/test_owner_functional_recovery_operations.py \
            --junitxml=artifacts/phase11-10q-same-origin-browser.xml

      - name: Record bounded evidence claim
        if: always()
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "workflow": "Phase 11.10q Same-origin Browser Acceptance Gate",
              "exact_head": os.environ["EXACT_HEAD"],
              "route_interception": False,
              "same_origin_http": True,
              "real_dtmo_persistence": True,
              "real_object_store": True,
              "governance_deep_evidence_included": True,
              "operations_runtime_evidence_included": True,
              "repository_controlled_thehive_emulator": True,
              "repository_controlled_intelowl_emulator": True,
              "live_external_connector_execution": False,
              "repository_controlled_environment": True,
              "whole_product_retest_preparation": True,
              "owner_functional_acceptance": False,
              "clean_external_installation_evidence": False,
              "staging_evidence": False,
              "production_equivalent_evidence": False,
              "external_assurance_evidence": False,
              "claim_boundary": "Exact-head repository-controlled whole-product retest preparation against the real built DTMO workbench, same-origin APIs, temporary PostgreSQL/object storage and bounded loopback integration emulators. The composed journey includes Governance deep evidence and Operations persisted runtime evidence. It does not replace the required external owner retest from a clean supported installation and is not staging, production-equivalent, production authorization or independent external assurance."
          }
          Path("artifacts/phase11-10q-same-origin-evidence.json").write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Stop exact-head DTMO
        if: always()
        run: |
          if test -f artifacts/phase11-10q-same-origin-server.pid; then kill "$(cat artifacts/phase11-10q-same-origin-server.pid)" || true; fi
          if test -f artifacts/phase11-10q-thehive-emulator.pid; then kill "$(cat artifacts/phase11-10q-thehive-emulator.pid)" || true; fi
          if test -f artifacts/phase11-10q-intelowl-emulator.pid; then kill "$(cat artifacts/phase11-10q-intelowl-emulator.pid)" || true; fi
          docker rm -f dtmo-functional-minio || true

      - name: Upload same-origin acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase11-10q-same-origin-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
