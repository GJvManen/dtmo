name: Phase 11.10q Same-origin Browser Acceptance Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/dtmo/**'
      - 'backend/tests/test_phase11_10q_same_origin_browser_acceptance.py'
      - 'backend/tests/test_owner_functional_recovery_browser_matrix.py'
      - 'backend/tests/test_owner_functional_recovery_threat_intelligence.py'
      - 'database/migrations/**'
      - '.github/workflows/phase11-10q-same-origin-browser-acceptance.yml'
      - 'docs/roadmap/FUNCTIONAL_RECOVERY_ACCEPTANCE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-origin-browser-acceptance:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dtmo
          POSTGRES_USER: dtmo
          POSTGRES_PASSWORD: dtmo-acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtmo -d dtmo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:2.19.6
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DTMO_ENVIRONMENT: development
      DTMO_DATABASE_URL: postgresql+psycopg://dtmo:dtmo-acceptance@127.0.0.1:5432/dtmo
      DTMO_OPENSEARCH_URL: http://127.0.0.1:9200
      DTMO_FEATURE_LIVE_CONNECTORS: 'false'
      DTMO_FEATURE_OPENCVE_CONNECTOR: 'false'
      DTMO_FEATURE_VULNERABILITY_LOOKUP_CONNECTOR: 'false'
      DTMO_FEATURE_MISP_CONNECTOR: 'false'
      DTMO_FEATURE_MISP_EXPORT: 'false'
      DTMO_FEATURE_AIL_CONNECTOR: 'false'
      DTMO_FEATURE_TARANIS_CONNECTOR: 'false'
      DTMO_FEATURE_INTELOWL_ENRICHMENT: 'false'
      DTMO_FEATURE_CORTEX_ANALYSIS: 'false'
      DTMO_FEATURE_OPENCTI_READ: 'false'
      DTMO_FEATURE_THEHIVE_HANDOFF: 'false'
      DTMO_E2E_BASE_URL: http://127.0.0.1:8765
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build exact-head canonical workbench
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'

      - name: Create exact-head database schema
        run: alembic upgrade head

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Start exact-head DTMO with built workbench
        shell: bash
        run: |
          mkdir -p artifacts
          DTMO_FRONTEND_DIST="$PWD/frontend/dist" uvicorn dtmo.main:app --app-dir backend --host 127.0.0.1 --port 8765 > artifacts/phase11-10q-same-origin-server.log 2>&1 &
          echo $! > artifacts/phase11-10q-same-origin-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/health > artifacts/phase11-10q-same-origin-health.json; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/phase11-10q-same-origin-server.log
          exit 1

      - name: Execute unmocked same-origin browser journeys
        run: |
          python -m pytest -q \
            backend/tests/test_phase11_10q_same_origin_browser_acceptance.py \
            backend/tests/test_owner_functional_recovery_browser_matrix.py \
            backend/tests/test_owner_functional_recovery_threat_intelligence.py \
            --junitxml=artifacts/phase11-10q-same-origin-browser.xml

      - name: Record bounded evidence claim
        if: always()
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "workflow": "Phase 11.10q Same-origin Browser Acceptance Gate",
              "exact_head": os.environ["EXACT_HEAD"],
              "route_interception": False,
              "same_origin_http": True,
              "real_dtmo_persistence": True,
              "external_connector_execution": False,
              "repository_controlled_environment": True,
              "owner_functional_acceptance": False,
              "staging_evidence": False,
              "production_equivalent_evidence": False,
              "external_assurance_evidence": False,
              "claim_boundary": (
                  "Exact-head repository-controlled browser acceptance against the real built DTMO workbench, "
                  "same-origin DTMO APIs and temporary PostgreSQL persistence. The journeys perform no external "
                  "connector execution and do not constitute owner acceptance, staging evidence, production-equivalent "
                  "validation, production authorization or independent external assurance."
              ),
          }
          Path("artifacts/phase11-10q-same-origin-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Stop exact-head DTMO
        if: always()
        run: |
          if test -f artifacts/phase11-10q-same-origin-server.pid; then
            kill "$(cat artifacts/phase11-10q-same-origin-server.pid)" || true
          fi

      - name: Upload same-origin acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase11-10q-same-origin-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
