name: Phase 11.10q Canonical Administration Workspace Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-administration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact frontend dependency graph
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build canonical workbench
        working-directory: frontend
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project test dependency graph
        run: python -m pip install -e '.[test]'
      - name: Validate canonical administration route and authority boundary
        run: python -m pytest -q backend/tests/test_phase11_10q_canonical_administration_workspace.py
