replicaCount: 3

image:
  repository: ghcr.io/gjvmanen/dtmo
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: ""

existingSecret: dtmo-runtime
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  targetName: dtmo-runtime
  remoteKeys: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

capacity:
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
    scaleDownStabilizationSeconds: 300
  saturation:
    cpuWarningPercentage: 80
    memoryWarningPercentage: 85
    rejectProductionSizingWithoutEvidence: true

upgrade:
  strategy:
    maxUnavailable: 0
    maxSurge: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  minReadySeconds: 10
  rollback:
    requirePriorImmutableDigest: true
    requirePostRollbackHealthEvidence: true
    forbidAutomaticDatabaseDownMigration: true

availability:
  topologySpread:
    enabled: true
    zoneMaxSkew: 1
    hostnameMaxSkew: 1
  podAntiAffinity:
    enabled: true
  terminationGracePeriodSeconds: 30
observability:
  metrics:
    enabled: false
    path: /metrics
    serviceMonitor:
      enabled: false
      interval: 30s
      additionalLabels: {}
  tracing:
    enabled: false
    otlpEndpoint: ""
  logging:
    format: json
networkPolicy:
  enabled: true
  ingressController:
    namespaceSelector: {}
    podSelector: {}
  egressCIDRs: []
podDisruptionBudget:
  enabled: true
  minAvailable: 2
probes:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
