replicaCount: 3

image:
  repository: ghcr.io/gjvmanen/dtmo
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: ""

existingSecret: dtmo-runtime

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  targetName: dtmo-runtime
  remoteKeys: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

availability:
  topologySpread:
    enabled: true
    zoneMaxSkew: 1
    hostnameMaxSkew: 1
  podAntiAffinity:
    enabled: true
  terminationGracePeriodSeconds: 30

networkPolicy:
  enabled: true
  ingressController:
    namespaceSelector: {}
    podSelector: {}
  egressCIDRs: []

podDisruptionBudget:
  enabled: true
  minAvailable: 2

probes:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
