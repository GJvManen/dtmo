replicaCount: 2

image:
  repository: ghcr.io/gjvmanen/dtmo
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}

service:
  type: ClusterIP
  port: 8000

existingSecret: dtmo-runtime

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  targetName: dtmo-runtime
  remoteKeys: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

networkPolicy:
  enabled: true
  ingressNamespaceSelector: {}
  egressCIDRs: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
