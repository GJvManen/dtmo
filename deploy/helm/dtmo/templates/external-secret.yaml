{{- if .Values.externalSecret.enabled }}
{{- if not .Values.externalSecret.secretStoreRef.name }}
{{- fail "externalSecret.secretStoreRef.name is required when externalSecret.enabled=true" }}
{{- end }}
{{- if not .Values.externalSecret.remoteKeys }}
{{- fail "externalSecret.remoteKeys must define at least one runtime secret mapping" }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-dtmo-runtime
  labels:
    app.kubernetes.io/name: dtmo
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecret.targetName }}
    creationPolicy: Owner
  data:
{{- range $secretKey, $remoteKey := .Values.externalSecret.remoteKeys }}
    - secretKey: {{ $secretKey | quote }}
      remoteRef:
        key: {{ $remoteKey | quote }}
{{- end }}
{{- end }}
