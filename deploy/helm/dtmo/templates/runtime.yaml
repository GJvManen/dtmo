{{- if not .Values.image.digest }}
{{- fail "image.digest is required; mutable image tags are not accepted for Phase 11.8" }}
{{- end }}
{{- if and .Values.externalSecret.enabled (not .Values.externalSecret.targetName) }}
{{- fail "externalSecret.targetName is required when externalSecret.enabled=true" }}
{{- end }}
{{- if lt (int .Values.replicaCount) 2 }}
{{- fail "replicaCount must be at least 2 for Phase 11.8d availability hardening" }}
{{- end }}
{{- if and .Values.podDisruptionBudget.enabled (lt (int .Values.podDisruptionBudget.minAvailable) 1) }}
{{- fail "podDisruptionBudget.minAvailable must be at least 1" }}
{{- end }}
{{- if ne (int .Values.upgrade.strategy.maxUnavailable) 0 }}
{{- fail "upgrade.strategy.maxUnavailable must remain 0 for Phase 11.8i" }}
{{- end }}
{{- if lt (int .Values.upgrade.strategy.maxSurge) 1 }}
{{- fail "upgrade.strategy.maxSurge must be at least 1 for Phase 11.8i" }}
{{- end }}
{{- if lt (int .Values.upgrade.revisionHistoryLimit) 2 }}
{{- fail "upgrade.revisionHistoryLimit must preserve at least two revisions" }}
{{- end }}
{{- if lt (int .Values.upgrade.progressDeadlineSeconds) 60 }}
{{- fail "upgrade.progressDeadlineSeconds must be at least 60 seconds" }}
{{- end }}
{{- if lt (int .Values.upgrade.minReadySeconds) 1 }}
{{- fail "upgrade.minReadySeconds must be at least 1 second" }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "networkPolicy.enabled must remain true when ingress.enabled=true" }}
{{- end }}
{{- if empty .Values.networkPolicy.ingressController.namespaceSelector }}
{{- fail "networkPolicy.ingressController.namespaceSelector is required when ingress.enabled=true" }}
{{- end }}
{{- if empty .Values.networkPolicy.ingressController.podSelector }}
{{- fail "networkPolicy.ingressController.podSelector is required when ingress.enabled=true" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-dtmo
  labels:
    app.kubernetes.io/name: dtmo
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- with .Values.serviceAccount.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dtmo
  labels:
    app.kubernetes.io/name: dtmo
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.upgrade.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.upgrade.progressDeadlineSeconds }}
  minReadySeconds: {{ .Values.upgrade.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.upgrade.strategy.maxUnavailable }}
      maxSurge: {{ .Values.upgrade.strategy.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dtmo
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dtmo
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.availability.terminationGracePeriodSeconds }}
      serviceAccountName: {{ .Release.Name }}-dtmo
      automountServiceAccountToken: false
{{- if .Values.availability.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.availability.topologySpread.zoneMaxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: dtmo
              app.kubernetes.io/instance: {{ .Release.Name }}
        - maxSkew: {{ .Values.availability.topologySpread.hostnameMaxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: dtmo
              app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- if .Values.availability.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: dtmo
                  app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
      securityContext:
        runAsNonRoot: {{ .Values.podSecurityContext.runAsNonRoot }}
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dtmo
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ ternary .Values.externalSecret.targetName (required "existingSecret is required" .Values.existingSecret) .Values.externalSecret.enabled }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                - ALL
          resources:
{{ toYaml .Values.resources | indent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dtmo
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: dtmo
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-dtmo
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dtmo
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-dtmo-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dtmo
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
{{- if .Values.ingress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
{{ toYaml .Values.networkPolicy.ingressController.namespaceSelector | indent 14 }}
          podSelector:
            matchLabels:
{{ toYaml .Values.networkPolicy.ingressController.podSelector | indent 14 }}
      ports:
        - protocol: TCP
          port: 8000
{{- else }}
    []
{{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- range .Values.networkPolicy.egressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
{{- end }}
