groups:
  - name: dtmo.connector.alerts
    rules:
      - alert: DTMOConnectorFailure
        expr: dtmo_connector_alert_active == 1
        for: 0m
        labels:
          severity: warning
          service: dtmo
        annotations:
          summary: "DTMO connector {{ $labels.connector }} has a terminal failure"
          action: "Inspect connector health, upstream availability, credentials and rate limits."
          clear_condition: "The alert clears after a subsequent successful connector run sets the signal to 0."

  - name: dtmo.queue.alerts
    rules:
      - alert: DTMOQueueBacklog
        expr: dtmo_queue_backlog_alert_active == 1
        for: 0m
        labels:
          severity: warning
          service: dtmo
        annotations:
          summary: "DTMO queue {{ $labels.queue }} backlog crossed the governed threshold"
          threshold_policy: "Raise at >=80% capacity; clear at <=50% capacity."
          action: "Inspect consumers and downstream dependency health; drain backlog before increasing producer throughput."
          clear_condition: "The alert clears only after observed utilization recovers to 50% capacity or lower."

  - name: dtmo.storage.alerts
    rules:
      - alert: DTMOStorageIntegrityFailure
        expr: dtmo_storage_integrity_alert_active == 1
        for: 0m
        labels:
          severity: critical
          service: dtmo
        annotations:
          summary: "DTMO storage {{ $labels.storage }} failed an integrity verification"
          action: "Stop trusting affected storage evidence; verify checksum and size receipts, then restore from known-good immutable evidence before reprocessing."
          clear_condition: "The alert clears after a subsequent successful integrity verification sets the signal to 0."

  - name: dtmo.api.alerts
    rules:
      - alert: DTMOApiServerErrors
        expr: dtmo_api_error_alert_active == 1
        for: 0m
        labels:
          severity: warning
          service: dtmo
        annotations:
          summary: "DTMO API route {{ $labels.route }} has repeated server errors"
          threshold_policy: "Raise after 3 consecutive HTTP 5xx outcomes; clear after 2 consecutive non-5xx outcomes."
          action: "Inspect the correlated request trace, recent deploys and downstream dependency health; do not retry destructive operations until the failure mode is understood."
          clear_condition: "The alert clears only after two consecutive non-5xx outcomes for the same bounded route template."

  - name: dtmo.search.alerts
    rules:
      - alert: DTMOSearchHealthFailure
        expr: dtmo_search_health_alert_active == 1
        for: 0m
        labels:
          severity: critical
          service: dtmo
        annotations:
          summary: "DTMO search cluster {{ $labels.cluster }} is red or unreachable"
          threshold_policy: "Raise after 2 consecutive red/unreachable health checks; clear after 2 consecutive green/yellow checks."
          action: "Inspect OpenSearch cluster health, node availability, shard allocation and recent changes; avoid treating incomplete search results as authoritative until health recovers."
          clear_condition: "The alert clears only after two consecutive green/yellow cluster-health observations."
