[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dtmo"
version = "16.0.0rc4"
description = "Education-focused cyber threat intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "redis>=6,<7",
  "minio>=7.2,<8",
  "apscheduler>=3.11,<4",
  "prometheus-client>=0.22,<1",
  "structlog>=25,<26",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "PyYAML>=6.0,<7",
  "pip-audit>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/dtmo"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q --disable-warnings --maxfail=1"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["backend/dtmo"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  '\.\.\.$',
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# Phase-1 executable baseline. These style/modernisation rules remain tracked as
# explicit technical debt and must be re-enabled incrementally after CI is stable.
ignore = ["E501", "I001", "UP017", "UP035", "S101"]

[tool.ruff.lint.per-file-ignores]
"backend/dtmo/auth/dependencies.py" = ["B008"]
"backend/tests/test_ci_workflow_contract.py" = ["S506"]
"backend/tests/test_production_security.py" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dtmo"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
